    {id:'k629',module:'选择性必修3·有机化学',q:'决定有机化合物特性的原子或原子团称为？',options:['同系物','官能团','取代基','烃基'],answer:1,explain:'官能团是决定有机物特性的原子或原子团，如—OH、—COOH。'},
    {id:'k630',module:'选择性必修3·有机化学',q:'烃的衍生物是指？',options:['烃分子中 H 被其他原子或原子团取代得到的物质','高分子化合物','仅含 C、H 的化合物','含苯环的化合物'],answer:0,explain:'烃的衍生物是烃分子中氢原子被其他原子或原子团取代所得，如 CH3Cl、CH3CH2OH。'},
    {id:'k631',module:'选择性必修3·有机化学',q:'乙醇的官能团名称和结构简式分别是？',options:['羧基，—COOH','醚键，—O—','醛基，—CHO','羟基，—OH'],answer:3,explain:'乙醇（CH3CH2OH）官能团为羟基，结构简式—OH。'},
    {id:'k632',module:'选择性必修3·有机化学',q:'下列官能团与物质对应正确的是？',options:['乙醛—酮羰基','乙酰胺—氨基','乙酸乙酯—羧基','溴乙烷—碳卤键'],answer:3,explain:'溴乙烷（CH3CH2Br）官能团为碳卤键；乙醛官能团是醛基，乙酸乙酯是酯基，乙酰胺是酰胺基。'},
    {id:'k633',module:'选择性必修3·有机化学',q:'同分异构体是指？',options:['结构相同、分子式不同的化合物','相差一个 CH2 的化合物','分子式相同、结构不同的化合物','同种元素形成的不同单质'],answer:2,explain:'同分异构体=相同分子式+不同结构；B 不存在，C 为同素异形体，D 为同系物。'},
    {id:'k634',module:'选择性必修3·有机化学',q:'正丁烷与异丁烷的异构属于？',options:['顺反异构','位置异构','碳架异构','官能团异构'],answer:2,explain:'二者分子式相同、碳链骨架不同，属碳架异构。'},
    {id:'k635',module:'选择性必修3·有机化学',q:'乙醇与二甲醚互为同分异构体，属于哪类异构？',options:['构象异构','官能团异构','位置异构','碳架异构'],answer:1,explain:'乙醇（醇）与二甲醚（醚）官能团类别不同，属官能团异构。'},
    {id:'k636',module:'选择性必修3·有机化学',q:'戊烷的同分异构体数目是？',options:['2','3','4','5'],answer:1,explain:'戊烷有正戊烷、异戊烷、新戊烷共 3 种碳架异构。'},
    {id:'k637',module:'选择性必修3·有机化学',q:'下列关于结构简式的书写，正确的是？',options:['醛基可简写为—CHO，羧基可简写为—COOH','碳碳双键、三键可省略','乙烷结构简式为 CH2CH2','结构简式中不写任何官能团'],answer:0,explain:'结构简式中 C=C、C≡C 不能省略；醛基—CHO、羧基—COOH 为约定简写；乙烷为 CH3CH3。'},
    {id:'k638',module:'选择性必修3·有机化学',q:'能反映分子空间构型（立体形状）的表示方法是？',options:['球棍模型/比例模型','实验式','结构式','结构简式'],answer:0,explain:'球棍模型与比例模型用于表示分子空间结构；结构式/简式只反映连接顺序不表空间构型。'},
    {id:'k639',module:'选择性必修3·有机化学',q:'乙烯的实验式（最简式）是？',options:['C2H4','C2H2','CH','CH2'],answer:3,explain:'乙烯分子式 C2H4，各元素最简整数比为 CH2。'},
    {id:'k640',module:'选择性必修3·有机化学',q:'蒸馏法分离液态有机混合物的原理是利用各组分的？',options:['密度不同','溶解度不同','沸点不同','分子量不同'],answer:2,explain:'蒸馏利用互溶液体混合物中各组分沸点不同进行分离，一般要求沸点差 >30℃。'},
    {id:'k641',module:'选择性必修3·有机化学',q:'选择萃取剂的原则不包括？',options:['萃取剂与溶质不反应','溶质在萃取剂中溶解度远大于原溶剂','萃取剂与原溶剂互不相溶且不反应','萃取剂沸点必须高于水'],answer:3,explain:'萃取剂三原则：溶解度大、与原溶剂不互溶不反应、与溶质不反应；对沸点无此要求。'},
    {id:'k642',module:'选择性必修3·有机化学',q:'重结晶法提纯固体有机物，所选溶剂应满足？',options:['被提纯物在热溶剂中溶解度大、冷溶剂中溶解度小','被提纯物在任何温度下均不溶','溶剂必须与水互溶','杂质溶解度与被提纯物相同'],answer:0,explain:'重结晶利用溶解度随温度变化大来析出晶体，杂质溶解度应很大或很小易于除去。'},
    {id:'k643',module:'选择性必修3·有机化学',q:'色谱法分离混合物的依据是？',options:['沸点差异','样品不同组分在两相（流动相/固定相）间分配不同','密度差异','颜色差异'],answer:1,explain:'色谱法因各组分在流动相与固定相间分配不同而实现分离。'},
    {id:'k644',module:'选择性必修3·有机化学',q:'确定有机物实验式（最简式）常用的方法是？',options:['元素分析（燃烧法测各元素质量分数）','质谱法','红外光谱','核磁共振氢谱'],answer:0,explain:'元素分析通过燃烧定量测定 C、H、N 等产物质量，推得各元素最简整数比即实验式。'},
    {id:'k645',module:'选择性必修3·有机化学',q:'质谱图中相对分子质量由什么确定？',options:['化学位移','红外吸收频率','吸收峰面积','质荷比最大的分子离子峰'],answer:3,explain:'质谱图最右侧分子离子峰（最大质荷比）对应样品相对分子质量。'},
    {id:'k646',module:'选择性必修3·有机化学',q:'红外光谱的主要作用是？',options:['测定氢原子种类和数目','确定相对分子质量','确定晶体结构','初步判断含有的化学键或官能团'],answer:3,explain:'不同化学键/官能团红外吸收频率不同，红外光谱可初步判断其存在。'},
    {id:'k647',module:'选择性必修3·有机化学',q:'核磁共振氢谱中，吸收峰的数目与面积比分别代表？',options:['碳原子种类数、碳氢比','氢原子总数、氢的种类数','氢原子种类数、各类氢原子个数比','官能团数目、分子量'],answer:2,explain:'峰数目=氢原子类型数；峰面积比=各类氢原子个数比。'},
    {id:'k648',module:'选择性必修3·有机化学',q:'X 射线衍射可用于？',options:['确定相对分子质量','判断官能团','测定氢原子种类','获得键长、键角等分子结构数据'],answer:3,explain:'X 射线衍射可获得键长、键角等结构数据，尤其用于晶体结构测定。'},
    {id:'k649',module:'选择性必修3·有机化学',q:'甲烷的分子构型是？',options:['直线形','平面正方形','平面三角形','正四面体'],answer:3,explain:'CH4 为正四面体，C 在中心、4 个 H 在顶点，键角 109°28′。'},
    {id:'k650',module:'选择性必修3·有机化学',q:'甲烷与氯气在光照下的反应属于？',options:['取代反应','加成反应','氧化反应','消去反应'],answer:0,explain:'CH4 中 H 被 Cl 取代生成 CH3Cl 等，属取代反应。'},
    {id:'k651',module:'选择性必修3·有机化学',q:'下列关于甲烷化学性质的描述，正确的是？',options:['能与强碱反应','易与溴水发生加成','通常较稳定，不与强酸、强碱、强氧化剂反应','能使酸性 KMnO4 褪色'],answer:2,explain:'甲烷化学性质稳定，一般不与强酸、强碱、高锰酸钾等强氧化剂反应。'},
    {id:'k652',module:'选择性必修3·有机化学',q:'甲烷分子中碳原子的杂化方式是？',options:['不杂化','sp3','sp2','sp'],answer:1,explain:'甲烷 C 形成 4 个 σ 键，采取 sp3 杂化。'},
    {id:'k653',module:'选择性必修3·有机化学',q:'烷烃系统命名时，选主链的原则是？',options:['任选一条碳链','选碳原子数最少的','选含支链最多的碳链','选最长碳链；等长时选支链最多的'],answer:3,explain:'系统命名选最长碳链为主链，等长时取支链最多者。'},
    {id:'k654',module:'选择性必修3·有机化学',q:'编号时使支链位次最小，若两端距支链同近且支链不同，应？',options:['从较复杂支链一端编号','从中间编号','随意编号','从较简单支链一端编号'],answer:3,explain:'两端同近且支链不同，从较简单支链一端开始编号。'},
    {id:'k655',module:'选择性必修3·有机化学',q:'下列烃基位号书写正确的是？',options:['2—乙基','3—丙基','2,3—二甲基','1—甲基'],answer:2,explain:'烷烃命名中不会出现"1—甲基、2—乙基、3—丙基"（主链选错）；相同取代基合并用中文数字，位号间用逗号。'},
    {id:'k657',module:'选择性必修3·有机化学',q:'同系物是指？',options:['结构相似，分子组成相差一个或若干个 CH2 的化合物','分子式相同、结构不同的物质','同种元素形成的不同单质','质子数相同中子数不同的原子'],answer:0,explain:'同系物=结构相似+相差 n 个 CH2；A 为同分异构体，C 为同素异形体，D 为同位素。'},
    {id:'k658',module:'选择性必修3·有机化学',q:'下列各组中互为同系物的是？',options:['金刚石与石墨','乙烯与环丙烷','甲烷与乙烷','正丁烷与异丁烷'],answer:2,explain:'甲烷、乙烷均为烷烃，相差 CH2，互为同系物；乙烯与环丙烷结构不相似，正丁烷与异丁烷为同分异构体，金刚石与石墨为同素异形体。'},
    {id:'k659',module:'选择性必修3·有机化学',q:'关于同位素、同素异形体、同系物、同分异构体的对象，正确的是？',options:['同系物对象为无机物','同位素对象为原子；同素异形体对象为单质','同分异构体对象仅为无机物','同素异形体对象为化合物'],answer:1,explain:'同位素对象原子，同素异形体对象单质，同系物对象有机化合物，同分异构体对象无机/有机化合物均可。'},
    {id:'k660',module:'选择性必修3·有机化学',q:'乙烯分子中碳原子的杂化方式及空间构型是？',options:['sp，直线形','sp3，正四面体','sp2，正四面体','sp2，所有原子共平面'],answer:3,explain:'乙烯 C 为 sp2 杂化，键角约 120°，6 个原子共平面。'},
    {id:'k662',module:'选择性必修3·有机化学',q:'乙烯燃烧产生黑烟的原因是？',options:['乙烯密度大','乙烯中碳的质量分数大（约 85.7%），燃烧不完全产生碳粒','乙烯含氮','乙烯含氧量高'],answer:1,explain:'乙烯含碳量高，燃烧不完全产生碳微粒致黑烟。'},
    {id:'k663',module:'选择性必修3·有机化学',q:'乙烯的用途不包括？',options:['衡量石油化工发展水平的标志','直接作高能燃料','合成高分子材料的原料','植物果实催熟剂'],answer:1,explain:'乙烯是重要化工原料、催熟剂、石化水平标志，一般不直接作高能燃料。'},
    {id:'k664',module:'选择性必修3·有机化学',q:'乙烯与溴的四氯化碳溶液反应的产物是？',options:['CH2Br—CH2Br','CH≡CH','CHBr2—CH3','CH3CH2Br'],answer:0,explain:'乙烯与 Br2 发生加成生成 1,2-二溴乙烷（CH2Br—CH2Br），使溴的 CCl4 溶液褪色。'},
    {id:'k665',module:'选择性必修3·有机化学',q:'实验室中可用乙烯与下列哪种试剂加成来制取纯净的氯乙烷？',options:['Cl2','H2O','H2','HCl'],answer:3,explain:'CH2=CH2 + HCl → CH3CH2Cl，可得纯净氯乙烷；与 Cl2 加成得 1,2-二氯乙烷。'},
    {id:'k666',module:'选择性必修3·有机化学',q:'乙烯在一定条件下与水加成可制取？',options:['乙酸','氯乙烷','乙醇','乙醛'],answer:2,explain:'CH2=CH2 + H2O → CH3CH2OH（乙醇），工业制乙醇方法之一。'},
    {id:'k667',module:'选择性必修3·有机化学',q:'由不饱和小分子通过加成结合成高分子的反应称为？',options:['酯化反应','消去反应','加成聚合反应（加聚反应）','取代反应'],answer:2,explain:'加聚反应是不饱和单体经加成形成高分子的反应，如乙烯加聚成聚乙烯。'},
    {id:'k668',module:'选择性必修3·有机化学',q:'烯烃燃烧的通式中，CnH2n 完全燃烧产物系数为？',options:['nCO2 + (n-1)H2O','2nCO2 + nH2O','nCO2 + nH2O','nCO2 + (n+1)H2O'],answer:2,explain:'CnH2n + 3n/2 O2 → nCO2 + nH2O。'},
    {id:'k669',module:'选择性必修3·有机化学',q:'1,3-丁二烯与溴水按 1:1 反应时，可生成？',options:['仅 1,4-加成产物','1,2-加成或 1,4-加成产物','不发生反应','仅 1,2-加成产物'],answer:1,explain:'共轭二烯烃与 Br2 1:1 加成可发生 1,2-加成（活泼键断裂）或 1,4-加成（双键一起断裂并新生双键）。'},
    {id:'k670',module:'选择性必修3·有机化学',q:'烯烃的物理性质递变规律，正确的是？',options:['密度均大于水','均易溶于水','相同分子式，支链越多熔沸点越低','碳原子数增多，熔沸点降低'],answer:2,explain:'同碳数烯烃支链越多熔沸点越低；碳原子数增多熔沸点升高；烯烃难溶于水、密度比水小。'},
    {id:'k671',module:'选择性必修3·有机化学',q:'丙烯与 HCl 加成，主产物可能是？',options:['不反应','仅 CH3CHClCH3','仅 CH3CH2CH2Cl','CH3CHClCH3 或 CH3CH2CH2Cl'],answer:3,explain:'不对称烯烃与 HCl 加成可因 H 加在不同碳上得两种产物（符合马氏规则通常以 2-氯丙烷为主，但题目考两种可能性）。'},
    {id:'k672',module:'选择性必修3·有机化学',q:'烯烃系统命名时，主链必须？',options:['含有双键的最长碳链','不含支链','任取一条碳链','含碳原子数最多即可，不必含双键'],answer:0,explain:'烯烃命名主链须含双键且最长，编号从离双键最近端开始。'},
    {id:'k673',module:'选择性必修3·有机化学',q:'产生顺反异构的条件不包括？',options:['双键可自由旋转','双键每个碳原子连接不同原子或原子团','分子具有碳碳双键','双键不能旋转'],answer:0,explain:'顺反异构源于双键不能旋转 + 每个双键碳连不同基团；双键不能自由旋转是条件之一，"可自由旋转"错误。'},
    {id:'k674',module:'选择性必修3·有机化学',q:'顺式结构是指两个相同原子或原子团？',options:['排列在双键两侧','不相连','位于同一碳上','排列在双键同一侧'],answer:3,explain:'顺式=相同基团在双键同侧；反式=在两侧。'},
    {id:'k675',module:'选择性必修3·有机化学',q:'乙炔分子中碳原子的杂化方式及空间构型是？',options:['sp3，正四面体','sp2，平面','不杂化，V 形','sp，直线形'],answer:3,explain:'乙炔 C 为 sp 杂化，键角 180°，4 原子共线，直线形分子。'},
    {id:'k676',module:'选择性必修3·有机化学',q:'乙炔燃烧火焰温度可达 3000℃ 以上，常用于？',options:['制塑料','消毒','催熟果实','切割或焊接金属'],answer:3,explain:'氧炔焰温度高，常用于金属切割与焊接。'},
    {id:'k677',module:'选择性必修3·有机化学',q:'乙炔与溴的四氯化碳溶液反应，最终可生成？',options:['仅 1,2-二溴乙烯','不反应','CHBr=CHBr（1,2-二溴乙烯）','CHBr2—CHBr2（1,1,2,2-四溴乙烷）'],answer:3,explain:'乙炔先与 1 mol Br2 成 1,2-二溴乙烯，再与第 2 mol Br2 加成得 1,1,2,2-四溴乙烷。'},
    {id:'k678',module:'选择性必修3·有机化学',q:'乙炔能使下列哪种溶液褪色？',options:['酸性 KMnO4','两者均可','两者均不可','溴水'],answer:1,explain:'乙炔含 C≡C，能与 Br2 加成、被酸性 KMnO4 氧化，均褪色。'},
    {id:'k679',module:'选择性必修3·有机化学',q:'炔烃的官能团及通式（单炔烃）是？',options:['碳碳三键，CnH2n+2','苯环，CnH2n-6','碳碳双键，CnH2n','碳碳三键，CnH2n-2'],answer:3,explain:'炔烃含 C≡C，单炔烃通式 CnH2n-2，化学性质与乙炔相似。'},
    {id:'k680',module:'选择性必修3·有机化学',q:'丙炔燃烧的化学方程式（配平）是？',options:['C3H4 + 4O2 → 3CO2 + 2H2O','2C3H4 + 5O2 → 6CO2 + 4H2O  （注：丙炔 C3H4）','2C3H4 + 6O2 → 6CO2 + 4H2O','2C3H4 + 4O2 → 6CO2 + 2H2O'],answer:1,explain:'2CH3C≡CH + 4O2 → 6CO2 + 2H2O（丙炔分子式 C3H4），A 配平正确。'},
    {id:'k682',module:'选择性必修3·有机化学',q:'苯分子中碳碳键的特点是？',options:['6 个碳碳单键','3 个双键、3 个单键交替','6 个键长完全相等，介于单双键之间的特殊键，含大 π 键','全为双键'],answer:2,explain:'苯 6 个 C 均 sp2 杂化形成 σ 骨架，p 轨道重叠成离域大 π 键，6 个键长相等（139 pm）。'},
    {id:'k683',module:'选择性必修3·有机化学',q:'苯与溴在 FeBr3 催化下发生的反应类型是？',options:['加成反应','取代反应（生成溴苯）','消去反应','氧化反应'],answer:1,explain:'苯环上 H 被 Br 取代生成溴苯，属取代反应，FeBr3 作催化剂。'},
    {id:'k684',module:'选择性必修3·有机化学',q:'下列关于苯化学性质的描述，正确的是？',options:['不能使酸性 KMnO4 褪色，较为稳定','能使酸性 KMnO4 褪色','不能与浓硝酸反应','不能与 H2 加成'],answer:0,explain:'苯较稳定，不能被酸性 KMnO4 氧化（不褪色），可在催化剂、加热下与 H2 加成、与混酸硝化。'},
    {id:'k685',module:'选择性必修3·有机化学',q:'苯的空间构型是？',options:['平面正六边形，12 个原子共面','直线形','正四面体','三角锥形'],answer:0,explain:'苯为平面正六边形，6 C + 6 H 共 12 个原子同平面，对位 4 原子共线。'},
    {id:'k686',module:'选择性必修3·有机化学',q:'苯的同系物通式（n≥7）为？',options:['CnH2n-2','CnH2n+2','CnH2n','CnH2n-6'],answer:3,explain:'苯同系物为一个苯环 + 烷基侧链，通式 CnH2n-6（n≥7，如甲苯 C7H8）。'},
    {id:'k687',module:'选择性必修3·有机化学',q:'苯的同系物能使酸性 KMnO4 褪色，原因是？',options:['苯环对侧链的影响，使侧链（与苯环直接相连的碳上有 H）被氧化为羧基','烷基被取代','苯环被氧化','发生加成'],answer:0,explain:'苯环影响侧链，与苯环直接相连的碳上有 H 时，侧链被 KMnO4 氧化为 —COOH（紫褪）。'},
    {id:'k688',module:'选择性必修3·有机化学',q:'甲苯与 Cl2 反应时，光照条件与 Fe 催化条件的主要区别是？',options:['两者均只在侧链','两者均只在苯环','光照发生在苯环上取代，催化发生在侧链','光照发生在侧链取代，催化发生在苯环上取代'],answer:3,explain:'光照下 Cl2 取代侧链 H；Fe 催化下取代苯环上 H（苯环上取代）。'},
    {id:'k689',module:'选择性必修3·有机化学',q:'甲苯硝化的产物（三硝基取代）中，硝基主要位于甲基的？',options:['任意位置','邻、对位','仅邻位','间位'],answer:1,explain:'甲基为邻对位定位基，甲苯硝化硝基主要在甲基邻、对位。'},
    {id:'k690',module:'选择性必修3·有机化学',q:'有机物分子中出现一个饱和碳原子时，结论是？',options:['所有原子可能共面','分子中所有原子不可能共面','至少 4 原子共线','至少 6 原子共面'],answer:1,explain:'饱和 C 连 4 个原子成四面体，分子中所有原子不可能共面（甲烷型）。'},
    {id:'k691',module:'选择性必修3·有机化学',q:'每出现一个碳碳双键，分子中至少有多少个原子共面？',options:['3','12','6','4'],answer:2,explain:'乙烯型，C=C 不能旋转，6 个原子（双键碳及所连 4 原子）共面。'},
    {id:'k692',module:'选择性必修3·有机化学',q:'每出现一个苯环，分子中至少有多少个原子共面？',options:['4','12','6','3'],answer:1,explain:'苯型 12 个原子共平面，对位 4 原子共线。'},
    {id:'k693',module:'选择性必修3·有机化学',q:'碳碳三键使分子中至少有多少个原子共线？',options:['4','6','3','12'],answer:0,explain:'乙炔型 4 个原子（C≡C 及所连 2 原子）共线。'},
    {id:'k694',module:'选择性必修3·有机化学',q:'石油分馏的原理是？',options:['利用烃的沸点不同，逐步升温气化再冷凝分离','利用烃的密度不同','利用烃的溶解度不同','利用烃的颜色不同'],answer:0,explain:'分馏利用各烃沸点不同，升温使不同馏分先后气化冷凝，馏分为混合物。'},
    {id:'k695',module:'选择性必修3·有机化学',q:'石油裂化的主要目的是？',options:['制备焦炭','获得乙烯等短链气态烃','获得芳香烃','提高轻质油（尤其汽油）产量'],answer:3,explain:'裂化将大分子断为小分子，提高汽油等轻质油产量；裂解才主要获乙烯丙烯。'},
    {id:'k696',module:'选择性必修3·有机化学',q:'石油裂解的主要目的是？',options:['获乙烯、丙烯等短链不饱和气态烃','获汽油','获沥青','获润滑油'],answer:0,explain:'裂解即深度裂化，主获乙烯、丙烯等短链气态不饱和烃。'},
    {id:'k697',module:'选择性必修3·有机化学',q:'催化重整的作用是？',options:['制备焦炭','链状烃转化为环状烃，获得芳香烃','提高汽油产量','脱硫'],answer:1,explain:'催化重整使链状烃结构调整转化为环状烃，获苯、甲苯等芳烃。'},
    {id:'k698',module:'选择性必修3·有机化学',q:'煤的干馏是指？',options:['通氧气燃烧','加氢液化','隔绝空气加强热使有机物分解','与水混合'],answer:2,explain:'煤干馏=隔绝空气加强热分解（焦化），得焦炭、煤焦油、焦炉气、粗氨水等。'},
    {id:'k699',module:'选择性必修3·有机化学',q:'煤的气化主要反应是？',options:['C + O2 → CO2','C + 2H2 → CH4','CO + H2 → CH3OH','C + H2O(g) → CO + H2'],answer:3,explain:'煤的气化将煤转可燃性气体，主反应 C(s)+H2O(g)=CO+H2（水煤气）。'},
    {id:'k700',module:'选择性必修3·有机化学',q:'煤的间接液化是先气化为合成气，再在催化剂作用下合成？',options:['焦炭','甲醇等','苯','甲烷'],answer:1,explain:'间接液化经合成气（CO、H2）在催化剂下合成甲醇等液体燃料。'},
    {id:'k702',module:'选择性必修3·有机化学',q:'酚的定义是？',options:['羟基连在脂肪烃基上','羟基连在侧链碳上','羟基与苯环碳原子直接相连','含两个羟基'],answer:2,explain:'酚=羟基直接与苯环碳相连（如苯酚 C6H5OH）；羟基连侧链碳为醇（如苯甲醇）。'},
    {id:'k703',module:'选择性必修3·有机化学',q:'纯净苯酚的颜色及在空气中变化是？',options:['无色晶体，易被空气氧化呈粉红色','黄色液体','红色晶体','无色，不变化'],answer:0,explain:'纯净苯酚为无色晶体，酚羟基易被氧化，露置空气变粉红，需密封保存。'},
    {id:'k704',module:'选择性必修3·有机化学',q:'苯酚与 FeCl3 溶液显色反应的现象是？',options:['蓝色','黄色','白色沉淀','显紫色'],answer:3,explain:'苯酚遇 FeCl3 溶液显紫色，是酚的显色反应（可检验酚羟基）。'},
    {id:'k705',module:'选择性必修3·有机化学',q:'常温下苯酚在水中的溶解度特点是？',options:['不溶于水也不溶于有机溶剂','易溶于水','任意比例溶于水','溶解度较小（约 9.3 g），65℃ 以上可与水混溶'],answer:3,explain:'常温苯酚水中溶解度小（S≈9.3g）呈浊液；>65℃ 可与水混溶，易溶于乙醇等有机溶剂。'},
    {id:'k706',module:'选择性必修3·有机化学',q:'醛的官能团及饱和一元醛通式是？',options:['—COOH，CnH2nO2','—OH，CnH2n+1OH','—CO—，CnH2nO','—CHO（醛基），CnH2nO'],answer:3,explain:'醛由烃基/氢与醛基（—CHO）相连，饱和一元醛通式 CnH2nO。'},
    {id:'k707',module:'选择性必修3·有机化学',q:'乙醛能被下列哪种弱氧化剂氧化（产生特征现象）？',options:['稀硫酸','乙醇','新制 Cu(OH)2（蓝色→砖红色）和银氨溶液（银镜）','食盐水'],answer:2,explain:'醛基有还原性，能被新制 Cu(OH)2 氧化（砖红 Cu2O）、与银氨溶液发生银镜反应。'},
    {id:'k708',module:'选择性必修3·有机化学',q:'乙醛催化加氢（还原）的生成物是？',options:['乙醇','乙酸','乙烯','乙醚'],answer:0,explain:'CH3CHO + H2 →(Ni,△) CH3CH2OH（乙醇），加氢还原为醇。'},
    {id:'k709',module:'选择性必修3·有机化学',q:'关于酮（如丙酮）的性质，正确的是？',options:['不能被银氨溶液、新制 Cu(OH)2 等弱氧化剂氧化，但能催化加氢成醇','能使 KMnO4 褪色','能被银氨溶液、新制 Cu(OH)2 氧化','不能发生任何反应'],answer:0,explain:'酮羰基无醛基的 H，不被银氨/新制 Cu(OH)2 氧化，但可催化加氢生成醇。'},
    {id:'k710',module:'选择性必修3·有机化学',q:'酯的结构通式及乙酸乙酯的官能团是？',options:['R—OH；羟基','R—CHO；醛基','RCOOR′；酯基（—COO—）','R—COOH；羧基'],answer:2,explain:'酯为羧酸羧基 —OH 被 —OR′ 取代，官能团酯基 —COO—。'},
    {id:'k711',module:'选择性必修3·有机化学',q:'酯在酸性条件下水解的特点是？',options:['可逆反应（如稀硫酸催化）','只生成羧酸','不可逆','不水解'],answer:0,explain:'酸性水解可逆，生成羧酸+醇；碱性水解不可逆生成羧酸盐+醇。'},
    {id:'k712',module:'选择性必修3·有机化学',q:'酯在碱性条件下水解（如 NaOH 溶液）的产物是？',options:['羧酸 + 醇','羧酸盐 + 醇','酮 + 醇','醛 + 醇'],answer:1,explain:'碱性水解不可逆，生成的酸与碱成盐，得羧酸盐+醇。'},
    {id:'k713',module:'选择性必修3·有机化学',q:'油脂的化学本质是？',options:['蛋白质','糖类','高级脂肪酸与甘油形成的酯（甘油三酯）','烃类'],answer:2,explain:'油脂=一分子甘油与三分子高级脂肪酸脱水形成的甘油三酯，属酯类。'},
    {id:'k714',module:'选择性必修3·有机化学',q:'常温下呈液态、含较多不饱和脂肪酸甘油酯的称为？',options:['磷脂','脂肪（如牛油）','蜡','油（如花生油、大豆油）'],answer:3,explain:'油=液态、含较多不饱和酸（花生油等）；脂肪=固态、含较多饱和酸（牛油等）。'},
    {id:'k715',module:'选择性必修3·有机化学',q:'按 R1、R2、R3 是否相同，油脂可分为？',options:['油和脂肪','单甘油酯（相同）和混合甘油酯（不同）','天然与合成','饱和与不饱和'],answer:1,explain:'R1=R2=R3 为简单（单）甘油酯；不完全相同为混合甘油酯。'},
    {id:'k716',module:'选择性必修3·有机化学',q:'油脂在碱性条件下的水解反应称为？',options:['裂解','皂化反应（制肥皂和甘油）','氢化反应','酯化反应'],answer:1,explain:'油脂碱性水解（皂化）生成高级脂肪酸盐（肥皂）和甘油。'},
    {id:'k717',module:'选择性必修3·有机化学',q:'油脂兼有烯烃性质的原因是？',options:['含苯环','含羟基','高级脂肪酸中含不饱和键，可发生加成','含醛基'],answer:2,explain:'许多油脂含不饱和脂肪酸甘油酯，含 C=C 可发生加成（如氢化制硬化油）。'},
    {id:'k718',module:'选择性必修3·有机化学',q:'酰胺（RCONH2）在碱性条件下水解产物是？',options:['ROH + NH3','RCOONa + NH3↑','RCOOH + NH3','RCHO + NH3'],answer:1,explain:'RCONH2 + NaOH → RCOONa + NH3↑（碱性水解，逸出氨气）。'},
    {id:'k719',module:'选择性必修3·有机化学',q:'关于酰胺，错误的是？',options:['可在酸或碱中加热水解','常用作溶剂（如 DMF）','不能发生水解','由羧酸分子羟基被氨基取代得到'],answer:2,explain:'酰胺可在酸/碱中加热水解（C 错），如 DMF 是良好溶剂。'},
    {id:'k720',module:'选择性必修3·有机化学',q:'有机合成的主要任务包括？',options:['仅增加碳原子数','构建碳骨架和引入官能团','仅去除官能团','只做取代反应'],answer:1,explain:'有机合成利用反应构建碳骨架、引入/转化官能团，得目标分子。'},
    {id:'k721',module:'选择性必修3·有机化学',q:'有机合成原则不包括？',options:['原料廉价易得、低毒低污染','步骤尽量少、副反应少、产率高','尽量臆造不存在的反应以简化路线','符合绿色化学、条件温和'],answer:2,explain:'合成须按真实反应规律，不能臆造不存在的反应；A/B/C 均为原则。'},
    {id:'k722',module:'选择性必修3·有机化学',q:'引入官能团时应注意？',options:['顺序任意，无需保护','一次完成','按反应顺序规律引入，注意先后顺序及对先引入官能团的保护','只引入一个官能团'],answer:2,explain:'多步合成需按顺序引入官能团，必要时保护先引入的基团（如氧化敏感基团先保护）。'},
    {id:'k723',module:'选择性必修3·有机化学',q:'糖类的组成与俗称，正确的是？',options:['糖都不含氧','多数糖分子中 H:O=2:1，可用通式 Cm(H2O)n 表示，称碳水化合物','糖只含 C','糖类只含 C、H，称碳水化合物'],answer:1,explain:'糖类一般 C、H、O，且 H:O=2:1，组成常写作 Cm(H2O)n，故又称碳水化合物（并非真含水分子）。'},
    {id:'k724',module:'选择性必修3·有机化学',q:'不能水解的糖称为？',options:['二糖','单糖（如葡萄糖、果糖）','寡糖','多糖'],answer:1,explain:'单糖不能水解；二糖水解 2 单糖，多糖水解≥10 单糖。'},
    {id:'k725',module:'选择性必修3·有机化学',q:'葡萄糖属于？',options:['酮糖','多糖','醛糖（含醛基和五个羟基）','二糖'],answer:2,explain:'葡萄糖含一个醛基、五个羟基，属醛糖（还原性糖），可被银氨/新制 Cu(OH)2 氧化。'},
    {id:'k726',module:'选择性必修3·有机化学',q:'葡萄糖与果糖的关系是？',options:['同分异构体（分子式均为 C6H12O6）','同系物','同种物质','同素异形体'],answer:0,explain:'葡萄糖（醛糖）与果糖（酮糖）分子式均为 C6H12O6、结构不同，互为同分异构体。'},
    {id:'k727',module:'选择性必修3·有机化学',q:'核糖与脱氧核糖属于？',options:['六碳糖（己糖）','二糖','五碳糖（戊糖），均为醛糖，具还原性','多糖'],answer:2,explain:'二者均为含 5 个碳的单糖（戊糖），是 RNA/DNA 组分，均为醛糖、有还原性。'},
    {id:'k728',module:'选择性必修3·有机化学',q:'手性碳原子是指？',options:['双键碳','连有 4 个不同原子或原子团的碳（不对称碳）','苯环上的碳','连有 4 个相同原子或原子团的碳'],answer:1,explain:'手性碳=连 4 个不同原子/基团的碳，使分子有对映异构体（手性分子）。'},
    {id:'k729',module:'选择性必修3·有机化学',q:'天然氨基酸主要属于？',options:['芳香氨基酸','α-氨基酸（氨基连在 α-碳上）','β-氨基酸','γ-氨基酸'],answer:1,explain:'天然蛋白质氨基酸多为 α-氨基酸（—NH2 与 —COOH 连在同一碳上），除甘氨酸外多为手性分子。'},
    {id:'k730',module:'选择性必修3·有机化学',q:'氨基酸分子中含有的酸、碱基团使其为？',options:['仅碱性','中性','两性化合物（能与酸、碱成盐）','仅酸性'],answer:2,explain:'氨基酸含 —COOH（酸）和 —NH2（碱），是两性化合物，与酸、碱均成盐。'},
    {id:'k731',module:'选择性必修3·有机化学',q:'蛋白质的盐析与变性，下列描述正确的是？',options:['盐析可逆（物理变化），变性不可逆（化学变化）','两者均不可逆','盐析不可逆','两者均可逆'],answer:0,explain:'盐析（浓轻金属盐/铵盐）是溶解度降低、可逆物理变化；变性（加热、强酸强碱、重金属盐等）结构改变、不可逆。'},
    {id:'k732',module:'选择性必修3·有机化学',q:'可用浓硝酸鉴别含苯环蛋白质，现象是？',options:['无变化','变红','白色沉淀，加热变黄','变蓝'],answer:2,explain:'含苯环蛋白质遇浓硝酸产生白色沉淀、加热变黄（显色反应，黄蛋白反应）。'},
    {id:'k733',module:'选择性必修3·有机化学',q:'鉴别毛料（蛋白质）与合成纤维可用？',options:['灼烧闻烧焦羽毛气味','溶于水','测密度','看颜色'],answer:0,explain:'蛋白质灼烧有烧焦羽毛气味，可鉴别毛料与合成纤维。'},
    {id:'k734',module:'选择性必修3·有机化学',q:'蛋白质水解的最终产物是？',options:['氨基酸','葡萄糖','脂肪酸','甘油'],answer:0,explain:'蛋白质在酸/碱/酶作用下逐步水解，最终得氨基酸。'},
  ],
  experiment: [
    {id:'e1',module:'必修一',q:'关于钠与水反应的现象，下列说法错误的是？',options:['钠浮在水面上','熔化成闪亮小球','在水面上四处游动','反应后产生白色沉淀'],answer:3,explain:'钠与水反应生成 NaOH 和 H₂，现象为浮、熔、游、响，溶液呈碱性（加酚酞变红），不产生白色沉淀。'},
    {id:'e2',module:'必修一',q:'铝热反应（如铝粉与氧化铁）常用于？',options:['焊接铁轨','制取氧气','净水','漂白'],answer:0,explain:'铝热反应放出大量热，可使生成的铁熔化，用于焊接铁轨（铝热焊）。'},
    {id:'e3',module:'必修一',q:'焰色试验中，钠元素火焰呈什么颜色？',options:['黄色','紫色（透过蓝色钴玻璃）','砖红色','绿色'],answer:0,explain:'钠的焰色为黄色；钾为紫色（需透过蓝色钴玻璃滤去钠的黄光）。'},
    {id:'e4',module:'选择性必修1',q:'用已知浓度的 NaOH 溶液滴定未知浓度盐酸，通常选用的指示剂是？',options:['酚酞','石蕊','无需指示剂','淀粉'],answer:0,explain:'强酸强碱滴定常用酚酞或甲基橙；酚酞终点由无色变为粉红色，便于观察。'},
    {id:'e5',module:'必修一',q:'实验室制取 NH₃ 常用的反应物是？',options:['氯化铵与氢氧化钙共热','加热硝酸铵','电解水','燃烧氢气'],answer:0,explain:'2NH₄Cl+Ca(OH)₂=CaCl₂+2NH₃↑+2H₂O，是实验室制氨气的标准方法。'},
    {id:'e6',module:'选择性必修1',q:'MnO₂ 与浓盐酸共热制取 Cl₂，浓盐酸在反应中表现的性质是？',options:['仅酸性','仅还原性','酸性和还原性','氧化性'],answer:2,explain:'浓盐酸提供 H⁺（表现酸性）和 Cl⁻（被氧化为 Cl₂，表现还原性）。'},
    {id:'e7',module:'必修一',q:'制取 Fe(OH)₂ 时，白色沉淀迅速变成灰绿色，最后变成红褐色，原因是？',options:['被空气中的 O₂ 氧化','被还原','受热分解','水解'],answer:0,explain:'Fe(OH)₂ 极易被空气中氧气氧化：4Fe(OH)₂+O₂+2H₂O=4Fe(OH)₃。'},
    {id:'e8',module:'必修一',q:'向蔗糖中滴加浓硫酸，蔗糖变黑并膨胀，主要体现浓硫酸的？',options:['吸水性','脱水性','强氧化性','酸性'],answer:1,explain:'浓硫酸按水的组成比脱去蔗糖中的 H、O 使其炭化变黑，体现脱水性。'},
    {id:'e9',module:'必修一',q:'用 CCl₄ 从溴水中萃取溴，分层后的现象是？',options:['上层呈橙红色','下层呈橙红色','不分层','溶液变无色'],answer:1,explain:'CCl₄ 密度比水大，溴在 CCl₄ 中溶解度大，故下层（CCl₄ 层）呈橙红色。'},
    {id:'e10',module:'必修一',q:'实验中少量浓硫酸溅到皮肤上，正确的处理是？',options:['立即用 NaOH 中和','直接用大量水冲洗即可','先用干布拭去，再用大量水冲洗，最后涂碳酸氢钠','涂上碳酸氢钠粉末'],answer:2,explain:'浓硫酸遇水放热，应先迅速用干布拭去，再用大量水冲洗，最后用 3%~5% NaHCO₃ 溶液处理。'},
    {id:'e11',module:'选择性必修2',q:'向 CuSO₄ 溶液中逐滴加入过量氨水，观察到的现象是？',options:['立即生成黑色沉淀','先产生蓝色沉淀，后沉淀溶解得到深蓝色溶液','无明显变化','产生白色沉淀'],answer:1,explain:'Cu²⁺ 先与氨水生成蓝色 Cu(OH)₂ 沉淀；过量氨水时形成 [Cu(NH₃)₄]²⁺ 深蓝色配离子，使沉淀溶解。'},
    {id:'e12',module:'选择性必修2',q:'下列事实能说明某固体属于分子晶体的是？',options:['熔点很高','熔融态不导电且熔点较低/易升华','硬度极大','固态能导电'],answer:1,explain:'分子晶体靠分子间作用力结合，熔点低、熔融态不导电；原子晶体/离子晶体熔点高，金属晶体可导电。'},
    {id:'e13',module:'必修一',q:'配制一定物质的量浓度的溶液，定容时俯视刻度线，所配溶液浓度将？',options:['偏高','偏低','无影响','无法判断'],answer:0,explain:'俯视使读数偏大，实际加水量偏少，溶液体积偏小，故浓度偏高。'},
    {id:'e14',module:'必修一',q:'除去 CO₂ 中混有的少量 HCl 气体，应选用的试剂是？',options:['NaOH 溶液','饱和 NaHCO₃ 溶液','水','澄清石灰水'],answer:1,explain:'饱和 NaHCO₃ 与 HCl 反应生成 CO₂，且不吸收 CO₂；NaOH、澄清石灰水都会吸收 CO₂。'},
    {id:'e15',module:'必修一',q:'关于容量瓶的构造，下列说法正确的是？',options:['细颈、梨形、平底玻璃瓶，瓶口配有磨口塞或塑料塞','粗颈、广口、圆底玻璃瓶','与普通烧杯形状相同，只是带刻度','没有瓶塞，靠橡胶塞封口'],answer:0,explain:'容量瓶为细颈、梨形、平底玻璃瓶，瓶口配有磨口塞或塑料塞，用于精确配制一定体积的溶液。'},
    {id:'e16',module:'必修一',q:'配制 100 mL 1.00 mol/L NaCl 溶液，理论上需 NaCl 5.85 g，用托盘天平实际应称取？',options:['5.85 g','5.9 g','5.8 g','6.0 g'],answer:1,explain:'托盘天平读数精确到 0.1 g，5.85 g 应四舍五入称取 5.9 g。'},
    {id:'e17',module:'必修一',q:'将烧杯中溶液注入容量瓶前，为什么要待溶液恢复室温？',options:['防止热溶液使容量瓶体积不准确（热胀冷缩）','加快固体溶解','防止液体暴沸','便于洗涤烧杯'],answer:0,explain:'热溶液体积偏大，若趁热定容，冷却后体积缩小，导致所配浓度偏高；且容量瓶不能受热，故须恢复室温后再转移。'},
    {id:'e18',module:'必修一',q:'转移后洗涤烧杯内壁和玻璃棒 2~3 次，并将洗涤液注入容量瓶，目的是？',options:['保证溶质全部转移到容量瓶','清洗实验仪器','稀释所配溶液','加快溶解'],answer:0,explain:'烧杯壁和玻璃棒上残留溶质，洗涤并将洗涤液并入容量瓶可保证溶质全部转移，避免浓度偏低。'},
    {id:'e19',module:'必修一',q:'定容时，当液面接近刻度线应如何操作？',options:['直接倾倒蒸馏水至刻度线','液面距刻度线 1~2 cm 处，改用胶头滴管滴加至凹液面最低处与刻度线相切','用玻璃棒引流加水','先摇匀再定容'],answer:1,explain:'定容时先加水至距刻线 1~2 cm，再改用胶头滴管逐滴加至凹液面最低处恰好与刻度线相切。'},
    {id:'e20',module:'必修一',q:'用固体 NaCl 配制 100 mL 1.00 mol/L 溶液，下列仪器中不需要的是？',options:['量筒','100 mL 容量瓶','玻璃棒','胶头滴管'],answer:0,explain:'用固体溶质配制时，仪器为托盘天平、药匙、烧杯、玻璃棒、容量瓶、胶头滴管、试剂瓶，不需要量筒（量筒用于量取浓溶液）。'},
    {id:'e21',module:'必修一',q:'下列关于容量瓶使用的说法，正确的是？',options:['可直接在容量瓶中溶解固体或稀释浓溶液','可长期在容量瓶中贮存溶液','不能配制任意体积的溶液','可加入过热或过冷的液体'],answer:2,explain:'容量瓶"四不能"：不能在瓶中直接溶解/稀释、不能加入过冷过热液体、不能作为反应容器或长期贮存、不能配制任意体积的溶液。故 C 正确。'},
    {id:'e22',module:'必修一',q:'配制 950 mL 1 mol/L NaCl 溶液，应选用容量瓶规格及计算依据是？',options:['950 mL 容量瓶，按 0.95 L 计算','1000 mL 容量瓶，按 1 L 计算','500 mL 容量瓶，分两次配制','任意规格均可'],answer:1,explain:'按"大而近"原则，无 950 mL 规格应选 1000 mL 容量瓶，计算溶质用量时按 1 L 计。'},
    {id:'e23',module:'必修一',q:'定容时仰视容量瓶刻度线，所配溶液浓度将？',options:['偏高','偏低','无影响','无法判断'],answer:1,explain:'仰视使读数偏小，实际加水量偏多，溶液体积偏大，故浓度偏低。'},
    {id:'e24',module:'必修一',q:'溶液未冷却至室温就转入容量瓶并定容，所配溶液浓度将？',options:['偏高','偏低','无影响','取决于溶质种类'],answer:0,explain:'热溶液体积偏大，冷却后体积缩小，定容时加水量相对偏少，浓度偏高。'},
    {id:'e25',module:'必修一',q:'容量瓶中有少量蒸馏水（定容前未倒出），对所配溶液浓度的影响是？',options:['偏高','偏低','无影响','无法判断'],answer:2,explain:'定容时仍要加水至刻度，瓶内原有少量水不改变最终溶质的量和溶液体积，故无影响。'},
    {id:'e26',module:'必修一',q:'转移后未洗涤烧杯和玻璃棒，所配溶液浓度将？',options:['偏高','偏低','无影响','无法判断'],answer:1,explain:'部分溶质残留在烧杯和玻璃棒上未转移，溶质偏少，浓度偏低。'},
    {id:'e27',module:'必修一',q:'定容摇匀后液面低于刻度线，又加水至刻度，所配溶液浓度将？',options:['偏高','偏低','无影响','无法判断'],answer:1,explain:'摇匀后液面下降是因为部分溶液留在瓶塞与瓶颈处，属正常；再加水会使体积偏大，浓度偏低。'},
    {id:'e28',module:'必修一',q:'用 MnO₂ 与浓盐酸加热制取 Cl₂，该反应中的氧化剂是？',options:['MnO₂','HCl','Cl₂','H₂O'],answer:0,explain:'MnO₂ + 4HCl(浓) → MnCl₂ + Cl₂↑ + 2H₂O，Mn 元素化合价由 +4 降至 +2，MnO₂ 作氧化剂。'},
    {id:'e29',module:'必修一',q:'用 MnO₂ 固体与浓盐酸在加热条件下制 Cl₂，气体发生装置属于？',options:['固 + 固加热','固 + 液加热','液 + 液加热','固 + 液不加热'],answer:1,explain:'反应物为固体（MnO₂）与液体（浓盐酸）且需加热，属"固 + 液加热"制气装置。'},
    {id:'e30',module:'必修一',q:'除去 Cl₂ 中混有的少量 HCl 气体，应选用的试剂是？',options:['饱和食盐水','浓硫酸','NaOH 溶液','水'],answer:0,explain:'Cl₂ 在饱和食盐水中溶解度小，而 HCl 极易溶于水，故用饱和食盐水除去 HCl；浓硫酸用于除水蒸气。'},
    {id:'e31',module:'必修一',q:'实验室收集 Cl₂，可采用的方法是？',options:['排水法','向下排空气法','向上排空气法或排饱和食盐水法','排 NaOH 溶液法'],answer:2,explain:'Cl₂ 密度比空气大且能溶于水，可用向上排空气法；又因在饱和食盐水中溶解度小，也可用排饱和食盐水法收集。'},
    {id:'e32',module:'必修一',q:'吸收 Cl₂ 尾气通常用 NaOH 溶液而不用 Ca(OH)₂ 溶液，原因是？',options:['Ca(OH)₂ 溶解度小、溶液浓度低，吸收不完全','Ca(OH)₂ 不与 Cl₂ 反应','NaOH 成本更低','Ca(OH)₂ 会与 Cl₂ 爆炸'],answer:0,explain:'Ca(OH)₂ 微溶，饱和溶液浓度很低，吸收 Cl₂ 不完全，故尾气用 NaOH 溶液吸收。'},
    {id:'e33',module:'必修一',q:'检验 Cl₂ 是否集满，可用湿润的淀粉-KI 试纸靠近瓶口，现象是？',options:['试纸变蓝','试纸变红','试纸褪色','无明显变化'],answer:0,explain:'Cl₂ 氧化 I⁻ 生成 I₂，I₂ 遇淀粉显蓝色，故试纸变蓝表示已集满。'},
    {id:'e34',module:'必修一',q:'用湿润的蓝色石蕊试纸检验 Cl₂ 是否集满，现象是？',options:['试纸立即褪色','试纸先变红后褪色','试纸变蓝','试纸不变色'],answer:1,explain:'Cl₂ 与水生成盐酸（使石蕊变红）和次氯酸（强氧化性使红色褪去），故先变红后褪色表示已集满。'},
  {id:'e35',module:'必修二',q:'检验混合气体中是否同时含有 CO₂ 和 SO₂，合理的装置连接顺序是？',options:['澄清石灰水 → 品红 → KMnO₄ → 品红','KMnO₄ → 品红 → 石灰水 → 品红','品红 → 石灰水 → KMnO₄ → 品红','品红 → KMnO₄(酸) → 品红 → 澄清石灰水'],answer:3,explain:'先用品红检验 SO₂，再用酸性 KMnO₄ 除去 SO₂，再用品红确认 SO₂ 除尽，最后用石灰水检验 CO₂（避免 SO₂ 干扰）。'},
  {id:'e36',module:'必修二',q:'上述装置中，酸性 KMnO₄ 溶液的作用是？',options:['检验 SO₂','检验 SO₂ 是否除尽','除去 SO₂','检验 CO₂'],answer:2,explain:'酸性 KMnO₄ 将 SO₂ 氧化除去，防止其使石灰水变浑浊而干扰 CO₂ 的检验。'},
  {id:'e37',module:'必修二',q:'为什么要设置第二个品红溶液？',options:['检验 SO₂','检验 SO₂ 是否除尽','除去 SO₂','吸收 CO₂'],answer:1,explain:'确认 SO₂ 已被 KMnO₄ 完全除去，避免残留 SO₂ 进入石灰水造成误判。'},
  {id:'e38',module:'必修二',q:'SO₂ 和 CO₂ 都能使澄清石灰水变浑浊，因此检验 CO₂ 前必须？',options:['先除去 SO₂','先干燥','先点燃','先加热'],answer:0,explain:'两者均使石灰水变浑浊，须先除尽 SO₂ 才能用石灰水检验 CO₂。'},
  {id:'e39',module:'必修二',q:'下列气体中，不能用浓硫酸干燥的是？',options:['O₂','CO₂','Cl₂','NH₃'],answer:3,explain:'浓硫酸不能干燥碱性气体（如 NH₃）和除 SO₂ 外的还原性气体（如 H₂S、HI）；NH₃ 会被酸吸收。'},
  {id:'e40',module:'必修二',q:'向蔗糖中滴入浓硫酸，蔗糖变黑、体积膨胀呈疏松多孔的炭，主要体现浓硫酸的？',options:['吸水性','强氧化性','酸性','脱水性'],answer:3,explain:'脱水性将蔗糖中 H、O 按 2:1 脱去生成炭（变黑、膨胀）；强氧化性在后续将 C 氧化为 CO₂ 并放出 SO₂，但“变黑”主因是脱水性。'},
  {id:'e41',module:'必修二',q:'铜与浓硫酸共热：Cu + 2H₂SO₄(浓) = CuSO₄ + SO₂↑ + 2H₂O，浓硫酸的作用是？',options:['只作氧化剂','只作酸','氧化性和酸性','还原性和酸性'],answer:2,explain:'生成 SO₂ 体现氧化性，生成 CuSO₄ 体现酸性。'},
  {id:'e42',module:'必修二',q:'下列气体能用浓硫酸干燥的是？',options:['HCl','H₂S','NH₃','HI'],answer:0,explain:'HCl 是酸性且非还原性气体，可被浓硫酸干燥；H₂S、HI 有还原性会被氧化，NH₃ 为碱性。'},
  {id:'e43',module:'必修二',q:'实验室制取 H₂S 的原料通常是？',options:['Na₂S 与浓 H₂SO₄','FeS 与稀 H₂SO₄ 或稀 HCl','Fe 与 HCl','CuS 与 HCl'],answer:1,explain:'FeS + 2HCl = FeCl₂ + H₂S↑ 或 FeS + H₂SO₄ = FeSO₄ + H₂S↑。'},
  {id:'e44',module:'必修二',q:'收集 H₂S 气体应采用？',options:['排水法','向下排空气法','排饱和食盐水','向上排空气法'],answer:3,explain:'H₂S 密度比空气大且能溶于水，用向上排空气法收集。'},
  {id:'e45',module:'必修二',q:'检验 H₂S 气体常用的试纸是？',options:['湿润的醋酸铅试纸（变黑）','湿润的品红试纸','澄清石灰水','淀粉-KI 试纸'],answer:0,explain:'H₂S 与 Pb(Ac)₂ 生成黑色 PbS，使醋酸铅试纸变黑，是特征检验。'},
  {id:'e46',module:'必修二',q:'常温下硅的化学性质不活泼，只与下列哪些物质反应？',options:['O₂、Cl₂','H₂O','F₂、HF、强碱（如 NaOH）','所有酸'],answer:2,explain:'常温下 Si 仅与 F₂、HF、强碱反应。'},
  {id:'e47',module:'必修二',q:'硅与 NaOH 溶液：Si + 2NaOH + H₂O = Na₂SiO₃ + 2H₂↑，H₂O 的作用是？',options:['还原剂','催化剂','溶剂','氧化剂'],answer:3,explain:'H₂O 中 H 由 +1 降到 0 生成 H₂，作氧化剂。'},
  {id:'e48',module:'必修二',q:'硅与氢氟酸：Si + 4HF = SiF₄↑ + 2H₂↑，该反应中 HF 用于？',options:['制冷剂','刻蚀玻璃的反应物之一','干燥剂','燃料'],answer:1,explain:'刻蚀玻璃的反应是 SiO₂ + 4HF = SiF₄↑ + 2H₂O，HF 是关键试剂。'},
  {id:'e49',module:'必修二',q:'工业制粗硅：SiO₂ + 2C = Si(粗) + 2CO↑，C 表现？',options:['氧化性','酸性','还原性','漂白性'],answer:2,explain:'C 由 0 升到 +2（CO），作还原剂。'},
  {id:'e50',module:'必修二',q:'SiO₂ 能与 NaOH 反应：SiO₂ + 2NaOH = Na₂SiO₃ + H₂O，说明 SiO₂ 是？',options:['碱性氧化物','酸性氧化物、硅酸的酸酐','两性氧化物','不成盐氧化物'],answer:1,explain:'SiO₂ 是硅酸的酸酐，属酸性氧化物，难溶于水。'},
  {id:'e51',module:'必修二',q:'用氢氟酸刻蚀玻璃的反应是？',options:['SiO₂ + 2NaOH = Na₂SiO₃ + H₂O','SiO₂ + 4HF = SiF₄↑ + 2H₂O','SiO₂ + CaO = CaSiO₃','SiO₂ + C = Si + 2CO'],answer:1,explain:'HF 是唯一能与 SiO₂ 反应的酸，可用于刻蚀玻璃。'},

  {id:'e55',module:'必修二',q:'甲烷与 Cl₂ 在光照下发生取代反应，观察到的现象是？',options:['无明显现象','气体颜色变浅、试管内壁有油状液滴、液面上升','发生爆炸','生成白色沉淀'],answer:1,explain:'光照下 CH₄ 与 Cl₂ 取代，Cl₂ 消耗使颜色变浅，生成油状氯代烷，气体体积减小使液面上升。'},

  const b = {};
  ['knowledge','experiment'].forEach(k=> b[k] = RAW_BANK[k].filter(q=>!d.has(q.id)));
  return b;
}
const MODULES = {knowledge:['必修一·基本概念','必修二','选择性必修1·反应原理','选择性必修2·物质结构与性质','选择性必修3·有机化学'], experiment:['必修一','必修二','选择性必修1','选择性必修2','选择性必修3']};
/* ===== 存储 ===== */
const K = {records:'records', points:'points', rewards:'rewards', levels:'levels', del:'wb_chem_deleted', flash:'flash', practice:'practice', dev:'wb_chem_dev'};
const MEM={}; // 应用数据内存存储；服务器为唯一数据源，刷新即从云端重新拉取
function getArr(key){
  if(key===K.del){ try{ return JSON.parse(localStorage.getItem(key))||[]; }catch(e){ return []; } } // 全局"已删题目"集合须跨刷新保留，例外沿用 localStorage
  try{ return JSON.parse(MEM[key]||'null')||[]; }catch(e){ return []; }
}
/* ===== 账户与云端（地基·阶段0） ===== */
const SESS_KEY='wb_chem_session', UK_PREFIX='wb_chem_u_';
function sessionUser(){ try{ return JSON.parse(localStorage.getItem(SESS_KEY))||null; }catch(e){ return null; } }
function setSession(u){ if(u) localStorage.setItem(SESS_KEY, JSON.stringify(u)); else localStorage.removeItem(SESS_KEY); }
/* 密码哈希：纯 JS（cyrb53），过渡方案——避免明文存储/传输；真安全需 HTTPS + 后端加盐哈希 */
function cyrb53(str, seed){ let h1=0xdeadbeef^seed, h2=0x41c6ce57^seed; for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); } h1=Math.imul(h1^(h1>>>16),2246822507); h1^=Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507); h2^=Math.imul(h1^(h1>>>13),3266489909); return 4294967296*(2097151&h2)+(h1>>>0); }
function pwHash(pw, salt){ const h1=cyrb53(pw, 0x9e3779b9 ^ (salt||'').length); const h2=cyrb53(pw+(salt||''), 0x85ebca6b); return ((h1>>>0).toString(16))+'-'+((h2>>>0).toString(16)); }
/* 当前用户的数据键：未登录时用 __none__ 占位（仅兜底，正常必有登录态） */
function ukey(base){ const u=sessionUser(); return UK_PREFIX + (u||'__none__') + '_' + base; }
/* 本地账户/本地注册登录已移除：认证强制走服务器（见 serverRegister/serverLogin），服务器为唯一数据源 */
function logout(){ setSession(null); setToken(''); }
/* ===== 云端同步（阶段1 实现） =====
   模式：DEFAULT_SERVER_URL 为空 = 纯本地（阶段0 行为，不破坏）；非空 = 走自建后端。
   生产默认用 location.origin（同页同源的绝对地址）：既开启云端同步，又因与页面同协议/同域
   而避免混合内容（HTTPS 页不再去请求 HTTP 接口，杜绝之前的 Load failed）。本地测试仍可加
   ?server=http://127.0.0.1:3000 覆盖。安全：密码经 cyrb53→cred 过网；服务端 scrypt 加盐哈希；
   Bearer token 30天。 */
const DEFAULT_SERVER_URL = location.origin;
const SERVER_USER_RE = /^[a-zA-Z0-9_]{3,20}$/;
function serverURL(){
  try{ const q=new URLSearchParams(location.search).get('server'); if(q) return q.replace(/\/$/,''); }catch(e){}
  return DEFAULT_SERVER_URL;
}
function credOf(pw){ return String(cyrb53(pw)>>>0); } // 与后端 scrypt(cred) 契约一致
const TOKEN_KEY='wb_chem_token';
function getToken(){ try{ return localStorage.getItem(TOKEN_KEY)||''; }catch(e){ return ''; } }
function setToken(t){ if(t) localStorage.setItem(TOKEN_KEY,t); else localStorage.removeItem(TOKEN_KEY); }
async function apiFetch(pathname, method, body){
  const base=serverURL(); if(!base) return {code:0, ok:false, msg:'本地模式'};
  const headers={'Content-Type':'application/json'}; const tk=getToken(); if(tk) headers['Authorization']='Bearer '+tk;
  const opt={method, headers}; if(body) opt.body=JSON.stringify(body);
  const resp=await fetch(base+pathname, opt); let data={};
  try{ data=await resp.json(); }catch(e){}
  return Object.assign({code:resp.status, ok:resp.status>=200&&resp.status<300}, data);
}
async function serverRegister(user, pw){
  user=(user||'').trim();
  if(!SERVER_USER_RE.test(user)) return {ok:false,msg:'用户名需 3-20 位字母/数字/下划线'};
  try{
    const r=await apiFetch('/api/register','POST',{user, cred:credOf(pw)});
    if(!r.ok) return {ok:false,msg:r.msg||'注册失败'};
    setToken(r.token); setSession(user); return {ok:true};
  }catch(e){ return {ok:false,msg:'网络错误：'+(e&&e.message||e)}; }
}
async function serverLogin(user, pw){
  user=(user||'').trim();
  const cred=credOf(pw);
  try{
    let r=await apiFetch('/api/login','POST',{user, cred});
    if(r.ok){ setToken(r.token); setSession(user); return {ok:true}; }
    if(r.code===404){ // 未知用户 → 首次以 server 登录自动建账户（后端自动注册，无需重输密码）
      const r2=await apiFetch('/api/register','POST',{user, cred});
      if(!r2.ok) return {ok:false,msg:r2.msg||'自动注册失败'};
      setToken(r2.token); setSession(user); return {ok:true};
    }
    return {ok:false,msg:r.msg||'登录失败'};
  }catch(e){ return {ok:false,msg:'网络错误：'+(e&&e.message||e)}; }
}
/* 推送当前用户全部进度到云端（server 模式）；本地模式无操作 */
async function syncUp(){
  const srv=serverURL(); if(!srv) return;
  const u=sessionUser(); if(!u) return;
  const data={}; const ts=Date.now();
  ['records','points','rewards','levels','flash','practice'].forEach(b=>{ data[b]=getArr(ukey(b)); });
  try{ const r=await apiFetch('/api/sync','POST',{client_ts:ts, data}); if(!r.ok) console.warn('[syncUp] 失败', r.msg); }
  catch(e){ console.warn('[syncUp] 异常', e&&e.message||e); }
}
/* 从云端拉取当前用户进度并写回本地（server 模式）；本地模式无操作。返回是否成功 */
async function syncDown(){
  const srv=serverURL(); if(!srv) return false;
  const u=sessionUser(); if(!u) return false;
  try{
    const r=await apiFetch('/api/sync','GET');
    if(!r.ok){ console.warn('[syncDown] 失败', r.msg); return false; }
    const data=r.data||{};
    ['records','points','rewards','levels','flash','practice'].forEach(b=>{ if(data[b]!==undefined) setArr(ukey(b), data[b]); });
    return true;
  }catch(e){ console.warn('[syncDown] 异常', e&&e.message||e); return false; }
}
/* 自动同步（server 模式）：先推本地（若有未同步数据），再拉云端最新；本地模式/未登录无操作。返回是否成功拉取 */
async function autoSync(){
  const srv=serverURL(); if(!srv) return false;
  const u=sessionUser(); if(!u) return false;
  const bases=['records','points','rewards','levels','flash','practice'];
  if(bases.some(b=>getArr(ukey(b)).length>0)) await syncUp();
  return await syncDown();
}
let authMode='login';
function setArr(key,arr){ if(key===K.del){ localStorage.setItem(key, JSON.stringify(arr)); return; } MEM[key]=JSON.stringify(arr); }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return fmtDate(new Date()); }
function dOffset(n){ const d=new Date(); d.setDate(d.getDate()+n); return fmtDate(d); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function qTypeTag(q){ return (q&&q.type)?('<span class="q-type">'+esc(q.type)+'</span>'):''; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ===== 清除预置示例数据（isDemo） ===== */
function initDemo(){
  setArr(ukey('records'),getArr(ukey('records')).filter(x=>!x.isDemo));
  setArr(ukey('points'),getArr(ukey('points')).filter(x=>!x.isDemo));
  setArr(ukey('rewards'),getArr(ukey('rewards')).filter(x=>!x.isDemo));
}

/* ===== 积分 ===== */
function balance(){
  let b=0; getArr(ukey('points')).forEach(p=>{ b += (p.type==='earn'?1:-1)*Number(p.amount||0); }); return b;
}
function addPoints(type,amount,reason){ const ps=getArr(ukey('points')); ps.push({id:uid(),type,amount:Number(amount),reason,date:todayStr()}); setArr(ukey('points'),ps); syncUp(); }
function balanceSeries(){
  const ps=[...getArr(ukey('points'))].sort((a,b)=>a.date<b.date?-1:1);
  let run=0; const map={}; ps.forEach(p=>{ run += (p.type==='earn'?1:-1)*Number(p.amount||0); map[p.date]=run; });
  return Object.keys(map).sort().map(d=>({date:d,value:map[d]}));
}

/* ===== 关卡（按模块自动分组，顺序解锁） ===== */
function buildLevels(){
  const lv=[];
  [['knowledge',BANK.knowledge],['experiment',BANK.experiment]].forEach(([bank,src])=>{
    const groups={};
    src.forEach(q=>{ (groups[q.module]=groups[q.module]||[]).push(q.id); });
    const order=MODULES[bank]||[];
    // 按 MODULES 指定顺序生成关卡，跳过无题模块
    order.forEach(mod=>{ if(groups[mod]&&groups[mod].length) lv.push({id:bank+'::'+mod,bank,module:mod,qids:groups[mod],pass:0.6}); });
    // 兜底：列出 MODULES 之外的模块（理论上不会发生）
    Object.keys(groups).forEach(mod=>{ if(order.indexOf(mod)<0) lv.push({id:bank+'::'+mod,bank,module:mod,qids:groups[mod],pass:0.6}); });
  });
  return lv;
}
let BANK = buildBank();
let LEVELS = buildLevels();
function getQ(bank,id){ return BANK[bank].find(x=>x.id===id); }
function rebuildAll(){ BANK = buildBank(); LEVELS = buildLevels(); }
function isDev(){ return false; }
/* 永久删除某道题：
   1) 从源头 RAW_BANK 中移除该元素（本次会话即时、彻底）；
   2) 记入 K.del 持久化，刷新/重载后仍会过滤；
   3) 「清空全部数据」不会清除 K.del，因此删除的题目永远无法恢复。 */
function deleteQuestion(bank,id){
  const arr = RAW_BANK[bank];
  const i = arr.findIndex(x=>x.id===id);
  if(i>=0) arr.splice(i,1);
  const ds=getArr(K.del); if(!ds.includes(id)) ds.push(id); setArr(K.del,ds);
  rebuildAll();
  setArr(ukey('records'), getArr(ukey('records')).filter(r=>r.qid!==id)); syncUp();
  toast('已永久删除该题目');
  renderAll();
}
function getLevelState(id){
  const all=getArr(ukey('levels')); const s=all.find(x=>x.id===id);
  return s||{cleared:false,best:0,correct:0,total:0,plays:0};
}
function saveLevelState(id,st){ const all=getArr(ukey('levels')).filter(x=>x.id!==id); all.push(st); setArr(ukey('levels'),all); syncUp(); }
function levelUnlocked(lv,list){
  if(isDev()) return true;
  const same=list.filter(x=>x.bank===lv.bank);
  const i=same.indexOf(lv);
  if(i<=0) return true;
  return getLevelState(same[i-1].id).cleared;
}

/* ===== 答题记录 + 积分（仅"首次答对"给分，杜绝重复刷分） ===== */
function recordAnswer(bank, q, correct){
  if(isDev()) return false;
  const recs=getArr(ukey('records'));
  const priorCorrect = recs.some(r=>r.qid===q.id && r.correct); // 本次之前是否已答对过该题
  recs.push({id:uid(),bank,qid:q.id,correct,date:todayStr(),score:correct?5:0});
  setArr(ukey('records'),recs);
  let awarded=false;
  if(correct && !priorCorrect){ addPoints('earn',5,'答对：'+q.q.replace(/[？?]。*$/,'。')); awarded=true; }
  syncUp();
  return awarded;
}
/* ===== 段位（掌握度驱动：已掌握去重题数 / 总题数，随题库自动缩放） ===== */
function totalQuestions(){ return (BANK.knowledge?BANK.knowledge.length:0)+(BANK.experiment?BANK.experiment.length:0); }
function masteredCount(){
  const valid=new Set(); (BANK.knowledge||[]).forEach(q=>valid.add(q.id)); (BANK.experiment||[]).forEach(q=>valid.add(q.id));
  const s=new Set();
  getArr(ukey('records')).forEach(r=>{ if(r.correct && valid.has(r.qid)) s.add(r.qid); });
  return s.size;
}
function rankOf(){
  const total=totalQuestions(), m=masteredCount();
  const tiers=[{name:'青铜',p:0},{name:'白银',p:0.10},{name:'黄金',p:0.30},{name:'铂金',p:0.60},{name:'钻石',p:0.90}];
  let cur=tiers[0], next=null;
  for(let i=0;i<tiers.length;i++){ if(m>=Math.ceil(total*tiers[i].p)){ cur=tiers[i]; next=tiers[i+1]||null; } }
  return {name:cur.name, mastered:m, total, curNeed:Math.ceil(total*cur.p), nextNeed:next?Math.ceil(total*next.p):null, nextName:next?next.name:null};
}

/* ===== 出题 ===== */
let SESSION_PLAYED = {knowledge:new Set(), experiment:new Set()};
function pickQuestion(bank, moduleFilter, forcedQid){
  if(forcedQid){ const q=BANK[bank].find(x=>x.id===forcedQid); return q||null; }
  let pool = BANK[bank];
  if(moduleFilter) pool = pool.filter(q=>q.module===moduleFilter);
  // 优先未在本轮练过的
  let avail = pool.filter(q=>!SESSION_PLAYED[bank].has(q.id));
  if(!avail.length){ SESSION_PLAYED[bank]=new Set(); avail = pool; }
  if(!avail.length) return null;
  return avail[Math.floor(Math.random()*avail.length)];
}
function renderQuiz(bank, q){
  const box = document.getElementById('mineQuiz');
  if(!q){ box.innerHTML='<div class="quiz-tip">题目未找到</div>'; return; }
  SESSION_PLAYED[bank].add(q.id);
  const letters=['A','B','C','D'];
  box.innerHTML = `
    <div class="quiz-meta">${esc(q.module)}${qTypeTag(q)}<span style="margin-left:6px;background:#f0f6ff;color:var(--primary);font-size:11px;padding:1px 7px;border-radius:20px;">${bank==='knowledge'?'知识点':'实验'}</span></div>
    <div class="quiz-q">${esc(q.q)}</div>
    <div id="optList">
      ${q.options.map((o,i)=>`<div class="opt" data-i="${i}"><span class="mark">${letters[i]}</span><span>${esc(o)}</span></div>`).join('')}
    </div>
    <div class="quiz-acts">
      <button class="btn-primary" id="quizSubmit">提交答案</button>
    </div>`;
  let chosen=null;
  box.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click',()=>{
      box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel'); chosen=Number(el.dataset.i);
    });
  });
  document.getElementById('quizSubmit').addEventListener('click',()=>{
    if(chosen===null){ toast('请先选择一个答案'); return; }
    submitQuiz(bank, q, chosen);
  });
}
function submitQuiz(bank, q, chosen){
  const correct = (chosen===q.answer);
  let awarded=false;
  if(!isDev()) awarded=recordAnswer(bank,q,correct);
  if(correct){ toast(isDev()?'答对啦':(awarded?'答对啦 +5 分':'答对啦（已掌握，不再加分）')); }
  else { toast('答错了，看解析复习一下'); }
  renderQuizResult(bank, q, chosen, correct);
  renderAll();
}
function renderQuizResult(bank, q, chosen, correct){
  const box = document.getElementById('mineQuiz');
  const letters=['A','B','C','D'];
  box.innerHTML = `
    <div class="quiz-meta">${esc(q.module)}${qTypeTag(q)}<span style="margin-left:6px;background:#f0f6ff;color:var(--primary);font-size:11px;padding:1px 7px;border-radius:20px;">${bank==='knowledge'?'知识点':'实验'}</span></div>
    <div class="quiz-q">${esc(q.q)}</div>
    <div>
      ${q.options.map((o,i)=>{
        let cls='opt';
        if(i===q.answer) cls+=' right';
        else if(i===chosen) cls+=' wrong';
        const tag = i===q.answer?'<b style="color:#2ecc71;margin-left:6px;">正确答案</b>':(i===chosen?'<b style="color:#e74c3c;margin-left:6px;">你的选择</b>':'');
        return `<div class="${cls}"><span class="mark">${letters[i]}</span><span>${esc(o)}${tag}</span></div>`;
      }).join('')}
    </div>
    <div class="explain"><b>解析：</b>${esc(q.explain)}</div>
    <div class="quiz-acts"><button class="btn-primary" id="quizClose">完成</button></div>`;
  document.getElementById('quizClose').addEventListener('click',closeReviewQuiz);
}
function closeReviewQuiz(){
  document.getElementById('mineQuizCard').style.display='none';

}

/* ===== 错题本（合并：知识点+实验，支持筛选） ===== */
let WRONG_BANK='all';

/* ===== 我的进度（游戏化：记住进度，不做日程提醒） ===== */
function computeStreak(){
  const set=new Set(getArr(ukey('records')).map(r=>r.date));
  if(!set.size) return 0;
  let d=new Date();
  if(!set.has(fmtDate(d))){ d.setDate(d.getDate()-1); if(!set.has(fmtDate(d))) return 0; }
  let cnt=0;
  while(set.has(fmtDate(d))){ cnt++; d.setDate(d.getDate()-1); }
  return cnt;
}
function renderToday(){
  const b=balance(), lv=rankOf();
  document.getElementById('progRank').textContent=lv.name+'段位';
  if(lv.nextNeed!==null){ const pct=Math.min(100,Math.round((lv.mastered-lv.curNeed)/(lv.nextNeed-lv.curNeed)*100));
    document.getElementById('progRankSub').textContent='已掌握 '+lv.mastered+' / '+lv.total+' 题（还差 '+(lv.nextNeed-lv.mastered)+' 题升 '+lv.nextName+'段）';
    document.getElementById('progRankBar').style.width=pct+'%';
  }else{ document.getElementById('progRankSub').textContent='已掌握 '+lv.mastered+' / '+lv.total+' 题，已达最高段位'; document.getElementById('progRankBar').style.width='100%'; }
  document.getElementById('progScore').textContent=b;
  document.getElementById('progStreak').textContent=computeStreak();
  document.getElementById('progToday').textContent=getArr(ukey('records')).filter(r=>r.date===todayStr()).length;
  const recs=getArr(ukey('records')).filter(r=>!r.correct);
  const seen={}; recs.forEach(r=>{ if(!seen[r.qid]) seen[r.qid]=r; });
  const qids=Object.keys(seen);
  document.getElementById('progWrongN').textContent=qids.length;
  const box=document.getElementById('todayList');
  if(!qids.length){ box.innerHTML='<div class="empty">还没有错题，继续保持！</div>'; return; }
  box.innerHTML=qids.map(qid=>{
    const kq=BANK.knowledge.find(x=>x.id===qid), eq=BANK.experiment.find(x=>x.id===qid);
    const q=kq||eq; if(!q) return '';
    const bank=kq?'knowledge':'experiment';
    return `<div class="today-item">
      <span class="tag">${bank==='knowledge'?'知识点':'实验'}</span>
      <div class="ti-main"><div class="ti-title">${esc(q.q)}</div><div class="ti-sub">${esc(q.module)}</div></div>
      <button class="do-btn" data-review="${bank}" data-qid="${qid}">去练习</button>
    </div>`;
  }).join('');
}

/* ===== 看板 ===== */
function renderStats(){
  const recs=getArr(ukey('records'));
  const total=recs.length, right=recs.filter(r=>r.correct).length;
  const rate = total? Math.round(right/total*100):0;
  document.getElementById('statTotal').textContent=total;
  document.getElementById('statRight').textContent=right;
  document.getElementById('statRate').textContent=rate+'%';
  const pieData=[{label:'答对',value:right,color:'#2ecc71'},{label:'答错',value:total-right,color:'#e74c3c'}];
  document.getElementById('pieChart').innerHTML=pieSVG(pieData,140);
  document.getElementById('pieLegend').innerHTML=pieData.filter(d=>d.value>0).map(d=>`<div><i style="background:${d.color}"></i>${d.label} ${d.value}</div>`).join('')||'<div style="color:var(--muted)">暂无数据</div>';
  // 段位进度已移至「段位与积分」卡片（renderRankCard 写入 rankBox），此处不再重复
}
function pieSVG(data,size){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total===0) return '<svg width="'+size+'" height="'+size+'"><circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+(size/2-4)+'" fill="#eef1f4"/></svg>';
  const cx=size/2,cy=size/2,r=size/2-4; let ang=-Math.PI/2,paths='';
  data.forEach(d=>{ if(d.value<=0) return; const frac=d.value/total,a2=ang+frac*2*Math.PI;
    const x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2),large=frac>0.5?1:0;
    paths+='<path d="M'+cx+' '+cy+' L'+x1.toFixed(1)+' '+y1.toFixed(1)+' A'+r+' '+r+' 0 '+large+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+' Z" fill="'+d.color+'"/>'; ang=a2; });
  return '<svg width="'+size+'" height="'+size+'">'+paths+'</svg>';
}

/* ===== 计时模式 ===== */
function setDur(d){
  if(!Number.isFinite(d)) d=DUR_DEFAULT; /* 仅当未传值/NaN 时回退默认，0 是合法下溢值需保留 */
  d=Math.max(DUR_MIN, Math.min(DUR_MAX, Math.round(d)));
  TIMED_DURATION=d;
  const num=document.getElementById('durNum');
  const range=document.getElementById('durRange');
  if(num) num.textContent=d;
  if(range) range.value=d;
  const btn=document.getElementById('timedStart');
  if(btn){ btn.disabled=false; btn.style.opacity='1'; btn.textContent='开始挑战（'+d+'分钟）'; }
}
function renderTimedSetup(){
  const range=document.getElementById('durRange');
  if(range){ range.min=DUR_MIN; range.max=DUR_MAX; range.step=1; range.value=DUR_DEFAULT; }
  setDur(DUR_DEFAULT);
}
function pickRandomAll(){
  const all=[...(BANK.knowledge||[]), ...(BANK.experiment||[])];
  if(!all.length) return null;
  return all[Math.floor(Math.random()*all.length)];
}
function startTimed(dur){
  TIMED={duration:dur,endAt:Date.now()+dur*60000,count:0,correct:0,currentQ:null};
  document.getElementById('timedSetup').style.display='none';
  document.getElementById('timedActive').style.display='';
  document.getElementById('timedResult').style.display='none';
  document.getElementById('timedCount').textContent='0';
  document.getElementById('timedRight').textContent='0';
  if(TIMED_INTERVAL) clearInterval(TIMED_INTERVAL);
  TIMED_INTERVAL=setInterval(timedTick, 1000);
  timedTick();
  renderTimedQuestion();
}
function timedTick(){
  if(!TIMED) return;
  const remain=Math.max(0, TIMED.endAt-Date.now());
  if(remain<=0){ endTimed(); return; }
  const m=Math.floor(remain/60000), s=Math.floor((remain%60000)/1000);
  document.getElementById('timedClock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimedQuestion(){
  if(!TIMED) return;
  const q=pickRandomAll();
  if(!q){ toast('题库为空'); endTimed(); return; }
  TIMED.currentQ=q;
  // 找出 q 所属 bank（knowledge 或 experiment）
  let qBank='knowledge';
  if((BANK.experiment||[]).some(x=>x.id===q.id)) qBank='experiment';
  TIMED.currentBank=qBank;
  SESSION_PLAYED[qBank].add(q.id);
  const letters=['A','B','C','D'];
  const box=document.getElementById('timedQuiz');
  box.innerHTML=`
    <div class="quiz-meta">${esc(q.module)}${qTypeTag(q)}<span style="margin-left:6px;background:#f0f6ff;color:var(--primary);font-size:11px;padding:1px 7px;border-radius:20px;">${qBank==='knowledge'?'知识点':'实验'}</span></div>
    <div class="quiz-q">${esc(q.q)}</div>
    <div id="optList">
      ${q.options.map((o,i)=>`<div class="opt" data-i="${i}"><span class="mark">${letters[i]}</span><span>${esc(o)}</span></div>`).join('')}
    </div>`;
  let chosen=null;
  box.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click',()=>{
      if(TIMED===null) return;
      if(chosen!==null) return; // 已答
      box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel'); chosen=Number(el.dataset.i);
      submitTimedAnswer(chosen);
    });
  });
}
function submitTimedAnswer(chosen){
  if(!TIMED) return;
  const q=TIMED.currentQ; const bank=TIMED.currentBank;
  const correct=(chosen===q.answer);
  TIMED.count++;
  if(correct) TIMED.correct++;
  // 高亮
  const box=document.getElementById('timedQuiz');
  box.querySelectorAll('.opt').forEach((el,i)=>{
    el.style.pointerEvents='none';
    if(i===q.answer) el.classList.add('right');
    else if(i===chosen) el.classList.add('wrong');
  });
  // 记录（计时模式也计入 records，便于看板统计；仅首次答对给分）
  if(!isDev()) recordAnswer(bank,q,correct);
  document.getElementById('timedCount').textContent=TIMED.count;
  document.getElementById('timedRight').textContent=TIMED.correct;
  // 0.5s 后下一题（若未结束）
  setTimeout(()=>{
    if(TIMED) renderTimedQuestion();
  }, 500);
}
function endTimed(){
  if(!TIMED) return;
  if(TIMED_INTERVAL){ clearInterval(TIMED_INTERVAL); TIMED_INTERVAL=null; }
  // 落库
  const recs=getArr(ukey('timed'));
  recs.push({id:uid(), duration:TIMED.duration, count:TIMED.count, correct:TIMED.correct, date:todayStr()});
  setArr(ukey('timed'), recs);
  syncUp();
  // 切到结果
  document.getElementById('timedActive').style.display='none';
  document.getElementById('timedResult').style.display='';
  document.getElementById('resultCount').textContent=TIMED.count;
  document.getElementById('resultRight').textContent=TIMED.correct;
  document.getElementById('resultRate').textContent=(TIMED.count? Math.round(TIMED.correct/TIMED.count*100):0)+'%';
  TIMED=null;
  renderTimedRecords();
}
function renderTimedRecords(){
  const box=document.getElementById('timedRecords');
  if(!box) return;
  const recs=getArr(ukey('timed'));
  if(!recs.length){ box.innerHTML='<div class="rec-empty">还没有刷题记录</div>'; return; }
  // 按时长分组，每组按 count 降序保留 TOP 5
  const groups={};
  recs.forEach(r=>{ (groups[r.duration]=groups[r.duration]||[]).push(r); });
  const durations=Object.keys(groups).map(Number).sort((a,b)=>a-b);
  box.innerHTML=durations.map(d=>{
    const top=groups[d].sort((a,b)=>b.count-a.count || b.correct-a.correct).slice(0,5);
    return `<div class="rec-group">
      <h4><span class="rec-tag">${d}分钟</span>TOP ${top.length}</h4>
      <div class="rec-list">
        ${top.map((r,i)=>`<div class="rec-item">
          <span class="ri-rank">${i+1}</span>
          <span class="ri-count">${r.count}题</span>
          <span class="ri-right">对${r.correct}</span>
          <span class="ri-rate">${r.count? Math.round(r.correct/r.count*100):0}%</span>
          <span class="ri-date">${esc(r.date)}</span>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

    renderTimedSetup();
    return;
  }
  if(t.id==='timedBack'){
    showTimedState('setup');
    return;
  }
});

/* ===== 关卡分层：模块 -> 多个 10 题小关 ===== */
const BATCH_SIZE = 10;
function buildBatches(lv){ const ids=lv.qids.slice(), bs=[]; for(let i=0;i<ids.length;i+=BATCH_SIZE) bs.push(ids.slice(i,i+BATCH_SIZE)); return bs; }
function batchId(lv,i){ return lv.id+'#'+i; }
function batchUnlocked(lv,i){
  if(isDev()) return true;
  if(!levelUnlocked(lv,LEVELS)) return false;
  if(i<=0) return true;
  return getLevelState(batchId(lv,i-1)).cleared;
}
function refreshModuleState(lv){
  const bs=buildBatches(lv);
  if(bs.length && bs.every((_,i)=>getLevelState(batchId(lv,i)).cleared)){
    const prev=getLevelState(lv.id);
    if(!prev.cleared){ saveLevelState(lv.id,{...prev,cleared:true}); addPoints('earn',20,'通关：'+lv.module); }
  }
}
let CURRENT_SUB=null;
function openLevel(id){
  const lv=LEVELS.find(x=>x.id===id); if(!lv) return;
  if(!levelUnlocked(lv,LEVELS)){ toast('先通关上一关再解锁'); return; }
  CURRENT_SUB=lv;
  document.getElementById('levelSubTitle').textContent=lv.module+'（'+lv.qids.length+' 题）';
  document.getElementById('levelSub').classList.add('show');
  renderLevelSub(lv);
}
function renderLevelSub(lv){
  const box=document.getElementById('levelBatchList');
  const bs=buildBatches(lv);
  box.innerHTML=bs.map((chunk,i)=>{
    const st=getLevelState(batchId(lv,i));
    const unlocked=batchUnlocked(lv,i);
    const cls=st.cleared?'cleared':(unlocked?'open':'locked');
    const best=st.best?(' · 最佳'+Math.round(st.best*100)+'%'):'';
    const lock=unlocked?'':'<span class="lv-lock">锁</span>';
    const btn=unlocked?'<button class="lv-go" data-batch="'+i+'">进入</button>':'';
    return '<div class="lv-card '+cls+'" '+(unlocked?'data-batch="'+i+'"':'')+'>'+lock+
      '<div class="lv-name">第 '+(i+1)+' 关</div>'+
      '<div class="lv-sub">'+chunk.length+' 题 · 达标 '+Math.round(lv.pass*100)+'%'+best+'</div>'+
      btn+'</div>';
  }).join('');
}
function startBatch(lv,i){
  const chunk=buildBatches(lv)[i];
  LEVEL_CTX={bank:lv.bank, qids:chunk, idx:0, correct:0, total:chunk.length, pass:lv.pass, levelId:batchId(lv,i), module:lv.module, moduleId:lv.id, batchIndex:i};
  document.getElementById('levelTitle').textContent=lv.module+' · 第'+(i+1)+'关（'+chunk.length+' 题）';
  document.getElementById('levelModal').classList.add('show');
  renderLevelQuestion();
}
function renderLevelQuestion(){
  const c=LEVEL_CTX; const q=getQ(c.bank, c.qids[c.idx]);
  document.getElementById('levelTitle').textContent=c.module+' · 第'+(c.batchIndex+1)+'关（'+c.total+' 题）';
  const box=document.getElementById('levelBody');
  const letters=['A','B','C','D'];
  box.innerHTML=
    '<div class="lv-progress">第 '+(c.idx+1)+' / '+c.total+' 题　已答对 '+c.correct+'</div>'+
    '<div class="quiz-meta">'+esc(q.module)+qTypeTag(q)+'</div>'+
    '<div class="quiz-q">'+esc(q.q)+'</div>'+
    '<div id="optList">'+q.options.map((o,i)=>'<div class="opt" data-i="'+i+'"><span class="mark">'+letters[i]+'</span><span>'+esc(o)+'</span></div>').join('')+'</div>'+
    '<div class="quiz-acts"><button class="btn-primary" id="lvSubmit">提交答案</button>'+(isDev()?'<button class="btn-ghost" id="lvSkip" style="margin-left:8px;">下一题</button><button class="btn-ghost" id="lvDel" style="margin-left:8px;">删除本题</button>':'')+'</div>';
  let chosen=null;
  box.querySelectorAll('.opt').forEach(el=>{ el.addEventListener('click',()=>{ box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); chosen=Number(el.dataset.i); }); });
  document.getElementById('lvSubmit').addEventListener('click',()=>{ if(chosen===null){ toast('请先选择一个答案'); return; } levelSubmit(c.bank,q,chosen); });
  const skipEl=document.getElementById('lvSkip');
  if(skipEl) skipEl.addEventListener('click',()=>{ if(c.idx+1<c.total){ c.idx++; renderLevelQuestion(); } else renderLevelResult(); });
  const delEl=document.getElementById('lvDel');
  if(delEl) delEl.addEventListener('click',()=>{
    if(!confirm('确定删除本题「'+q.q+'」？\n删除后将从题库永久移除，无法恢复（清空数据也不会还原）。')) return;
    const curId=c.qids[c.idx];
    deleteQuestion(c.bank, curId);
    c.qids.splice(c.idx,1); c.total=c.qids.length;
    if(c.idx>=c.total){ renderLevelResult(); } else { renderLevelQuestion(); }
  });
}
function levelSubmit(bank,q,chosen){
  const correct=(chosen===q.answer); const c=LEVEL_CTX;
  if(!isDev()) recordAnswer(bank,q,correct);
  if(correct){ c.correct++; }
  const box=document.getElementById('levelBody');
  const letters=['A','B','C','D'];
  box.innerHTML=
    '<div class="quiz-meta">'+esc(q.module)+qTypeTag(q)+'</div>'+
    '<div class="quiz-q">'+esc(q.q)+'</div>'+
    '<div>'+q.options.map((o,i)=>{ let cls='opt'; if(i===q.answer) cls+=' right'; else if(i===chosen) cls+=' wrong';
      const tag=i===q.answer?'<b style="color:#2ecc71;margin-left:6px;">正确答案</b>':(i===chosen?'<b style="color:#e74c3c;margin-left:6px;">你的选择</b>':'');
      return '<div class="'+cls+'"><span class="mark">'+letters[i]+'</span><span>'+esc(o)+tag+'</span></div>'; }).join('')+'</div>'+
    '<div class="explain"><b>解析：</b>'+esc(q.explain)+'</div>'+
    '<div class="quiz-acts"><button class="btn-primary" id="lvNext">'+(c.idx+1<c.total?'下一题':'查看结算')+'</button></div>';
  document.getElementById('lvNext').addEventListener('click',()=>{ if(c.idx+1<c.total){ c.idx++; renderLevelQuestion(); } else renderLevelResult(); });
  renderAll();
}
function renderLevelResult(){
  const c=LEVEL_CTX; const rate=c.correct/c.total; const pass=rate>=c.pass;
  let firstClear=false;
  if(!isDev()){
    const st=getLevelState(c.levelId); firstClear=!st.cleared && pass;
    saveLevelState(c.levelId,{id:c.levelId, cleared:st.cleared||pass, best:Math.max(st.best,rate), correct:c.correct, total:c.total, plays:st.plays+1});
    if(firstClear){ addPoints('earn',20,'通关：'+c.module+' 第'+(c.batchIndex+1)+'关'); }
    refreshModuleState(LEVELS.find(x=>x.id===c.moduleId));
  }
  const box=document.getElementById('levelBody');
  box.innerHTML=
    '<div style="text-align:center;padding:14px 0;">'+
      '<div style="font-size:20px;font-weight:800;color:'+(pass?'#27ae60':'#e67e22')+';">'+(pass?'恭喜过关！':'再接再厉')+'</div>'+
      '<div class="lv-progress" style="margin-top:8px;">答对 '+c.correct+' / '+c.total+'　正确率 '+Math.round(rate*100)+'%（达标 '+Math.round(c.pass*100)+'%）</div>'+
      (pass?'<div style="color:var(--muted);font-size:13px;">'+(firstClear?'已通关 +20 分，下一关已解锁！':'本关已通关')+'</div>':'<div style="color:var(--muted);font-size:13px;">达标线 '+Math.round(c.pass*100)+'%，差一点，再来一次就能解锁下一关</div>')+
    '</div>'+
    '<div class="quiz-acts"><button class="btn-primary" id="lvBack">返回关卡列表</button></div>';
  document.getElementById('lvBack').addEventListener('click',closeLevel);
  renderAll();
}
function closeLevel(){ document.getElementById('levelModal').classList.remove('show'); LEVEL_CTX=null; if(CURRENT_SUB) renderLevelSub(CURRENT_SUB); }
function closeSub(){ document.getElementById('levelSub').classList.remove('show'); CURRENT_SUB=null; }

/* ===== 关卡事件 ===== */
document.getElementById('levelMapK').addEventListener('click',e=>{ const c=e.target.closest('.lv-card'); if(c&&c.dataset.level) openLevel(c.dataset.level); });
document.getElementById('levelMapE').addEventListener('click',e=>{ const c=e.target.closest('.lv-card'); if(c&&c.dataset.level) openLevel(c.dataset.level); });
document.getElementById('levelBatchList').addEventListener('click',e=>{
  const c=e.target.closest('[data-batch]'); if(!c) return;
  const i=Number(c.dataset.batch), lv=CURRENT_SUB; if(!lv) return;
  if(!batchUnlocked(lv,i)){ toast('先通过上一关再解锁'); return; }
  startBatch(lv,i);
});
document.getElementById('levelClose').addEventListener('click',closeLevel);
document.getElementById('levelSubClose').addEventListener('click',closeSub);
document.getElementById('levelModal').addEventListener('click',e=>{ if(e.target.id==='levelModal') closeLevel(); });
document.getElementById('levelSub').addEventListener('click',e=>{ if(e.target.id==='levelSub') closeSub(); });

/* ===== 启动 ===== */
initDemo();
refreshAccountUI();
bootApp();

/* ===== 账户 UI（地基·阶段0） ===== */
function refreshAccountUI(){
  const el=document.getElementById('accountCardUser'); if(!el) return;
  const u=sessionUser(); el.textContent = u? u : '未登录';
  const btn=document.getElementById('accountCardBtn');
  if(btn){
    btn.textContent = u? '切换/登出' : '登录';
    btn.title = u? ('当前：'+u) : '登录账户';
  }
}
function bootApp(){
  if(sessionUser()){
    // 已登录：server 模式下先与云端同步（拉取其他设备的进度），再渲染，避免"只有登出再登录才同步"
    if(serverURL()){
      autoSync().catch(e=>console.warn('[bootApp] 同步失败', e&&e.message||e)).finally(renderAll);
    } else { renderAll(); }
  } else { openAuth('login'); }
}
/* 后台自动同步：长开页面也能持续对齐云端（如另一台设备刚攒的积分）。
   进行中的计时答题（TIMED_INTERVAL 活跃）时跳过，避免打断；仅在数据确实有变化时才重渲染。 */
(function startAutoSyncHeartbeat(){
  const BASES=['records','points','rewards','levels','flash','practice'];
  const sig=()=>BASES.map(b=>JSON.stringify(getArr(ukey(b)))).join('|');
  setInterval(async ()=>{
    if(!sessionUser() || !serverURL() || TIMED_INTERVAL) return; // 未登录 / 答题进行中 → 跳过
    const before=sig();
    const ok=await autoSync().catch(()=>false);
    if(ok && sig()!==before) renderAll(); // 仅当云端数据有变化才刷新界面
  }, 90000);
})();
function openAuth(mode){
  const u=sessionUser();
  const closeBtn=document.getElementById('authClose');
  if(u){
    showAuthLoggedIn();
    if(closeBtn) closeBtn.style.display='';
  } else {
    showAuthForm(mode||'login'); // 云端账户：默认登录表单；后端对未知用户自动建账户
    if(closeBtn) closeBtn.style.display='';
  }
  document.getElementById('authMask').classList.add('show');
}
function closeAuth(){ document.getElementById('authMask').classList.remove('show'); }
function showAuthForm(mode){
  authMode=mode;
  document.getElementById('authForm').style.display='';
  document.getElementById('authLoggedIn').style.display='none';
  document.getElementById('authPw2Row').style.display = mode==='register'?'':'none';
  document.getElementById('authTitle').textContent = mode==='register'?'注册账户':'登录';
  document.getElementById('authSubmit').textContent = mode==='register'?'注册并进入':'登录';
  document.getElementById('authSwitch').textContent = mode==='register'?'已有账户？去登录':'没有账户？去注册';
  document.getElementById('authMsg').textContent='';
  document.getElementById('authUser').value=''; document.getElementById('authPw').value=''; document.getElementById('authPw2').value='';
  setTimeout(()=>{ const i=document.getElementById('authUser'); if(i) i.focus(); },50);
}
function showAuthLoggedIn(){
  document.getElementById('authForm').style.display='none';
  document.getElementById('authLoggedIn').style.display='';
  document.getElementById('authCurUser').textContent=sessionUser();
}
async function onAuthSubmit(){
  const u=document.getElementById('authUser').value, p=document.getElementById('authPw').value;
  const msg=document.getElementById('authMsg'); msg.textContent='';
  if(!u||!p){ msg.textContent='请输入用户名和密码'; return; }
  let r;
  if(authMode==='register'){
    const p2=document.getElementById('authPw2').value;
    if(p!==p2){ msg.textContent='两次输入的密码不一致'; return; }
    r = await serverRegister(u,p);
  } else {
    r = await serverLogin(u,p);
  }
  if(!r.ok){ msg.textContent=r.msg; return; }
  closeAuth(); refreshAccountUI();
  // 云端模式：登录/注册成功后先推本地(若有)再拉云端最新，保证多端一致
  const bases=['records','points','rewards','levels','flash','practice'];
  if(bases.some(b=>getArr(ukey(b)).length>0)) await syncUp();
  await syncDown();
  renderAll();
}
function onAuthLogout(){
  logout(); refreshAccountUI();
  openAuth('login');
}
function onAuthSwitchUser(){
  logout(); openAuth('login');
}
// 账户卡按钮监听已移至 body 事件委托外的 accountCardBtn 绑定（避免重复）
document.getElementById('authClose').addEventListener('click',closeAuth);
document.getElementById('authSubmit').addEventListener('click',onAuthSubmit);
document.getElementById('authSwitch').addEventListener('click',()=>{ showAuthForm(authMode==='register'?'login':'register'); });
document.getElementById('authLogout').addEventListener('click',()=>{ closeAuth(); onAuthLogout(); });
document.getElementById('authSwitchUser').addEventListener('click',()=>{ closeAuth(); onAuthSwitchUser(); });
document.getElementById('authMask').addEventListener('click',e=>{ if(e.target.id==='authMask' && document.getElementById('authClose').style.display!=='none') closeAuth(); });
</script>
