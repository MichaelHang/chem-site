<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>高中化学练习台 · 人教版浙江高考</title>
<style>
:root{
  --primary:#2b7de9; --primary-dark:#1c5fb8; --green:#2ecc71; --red:#e74c3c; --orange:#f39c12;
  --bg:#f5f7fa; --card:#fff; --text:#1f2a37; --muted:#7a8794; --line:#e6eaef; --radius:14px; --shadow:0 2px 10px rgba(30,50,90,.06);
  --spring:cubic-bezier(.34,1.42,.64,1); --ease:cubic-bezier(.32,.72,0,1);
  --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.85);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;font-optical-sizing:auto;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;}
header{position:fixed;top:0;left:0;right:0;height:56px;z-index:30;background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--primary-dark);}
.logo svg{width:24px;height:24px;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.balance{display:flex;align-items:center;gap:5px;background:#fff7e6;color:var(--orange);font-weight:700;padding:6px 10px;border-radius:20px;font-size:14px;white-space:nowrap;}
.balance svg{width:16px;height:16px;}
.icon-btn{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--text);min-height:40px;}
.icon-btn svg{width:16px;height:16px;}
.container{max-width:920px;margin:0 auto;padding:66px 14px 30px;}
.today{background:linear-gradient(135deg,#fff,#fbfdff);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow);}
.today h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:7px;}
.today h2 svg{width:18px;height:18px;color:var(--primary);}
.today .empty{color:var(--muted);font-size:14px;padding:6px 0;}
.today-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:#fff;border:1px solid var(--line);margin-bottom:8px;}
.today-item:last-child{margin-bottom:0;}
.today-item .tag{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--muted);white-space:nowrap;}
.today-item.overdue{border-color:#f5c6c0;background:#fff5f3;}
.today-item.overdue .tag{background:var(--red);color:#fff;}
.today-item.soon .tag{background:var(--orange);color:#fff;}
.today-item .ti-main{flex:1;min-width:0;}
.today-item .ti-title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.today-item.overdue .ti-title{color:var(--red);}
.today-item .ti-sub{font-size:12px;color:var(--muted);}
.today-item .do-btn{background:var(--primary);color:#fff;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:600;white-space:nowrap;min-height:40px;}
.prog-grid{display:flex;gap:14px;flex-wrap:wrap;}
.prog-rank{flex:1;min-width:200px;background:linear-gradient(135deg,#eef5ff,#f7faff);border:1px solid #d6e6ff;border-radius:12px;padding:14px;}
.prog-rank .rank-name{font-size:20px;font-weight:800;color:var(--primary-dark);letter-spacing:-.01em;}
.prog-rank .rank-sub{font-size:13px;color:var(--muted);margin:3px 0 10px;}
.prog-stats{flex:1;min-width:200px;display:flex;gap:8px;align-items:center;justify-content:space-around;}
.prog-stats .ps{display:flex;flex-direction:column;align-items:center;flex:1;}
.prog-stats .ps span{font-size:24px;font-weight:800;color:var(--primary);letter-spacing:-.01em;}
.prog-stats .ps small{font-size:12px;color:var(--muted);margin-top:3px;}
.prog-todo{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
.todo-head{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.todo-head b{color:var(--red);}
.todo-hint{font-size:12px;color:var(--muted);font-weight:400;}
.tabbar{position:sticky;top:56px;z-index:20;background:rgba(245,247,250,.78);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);display:flex;gap:6px;padding:8px 0;margin-bottom:14px;}
.tabbar button{flex:1;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 4px;font-size:14px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;transition:transform .12s var(--spring),background .18s,color .18s,border-color .18s;will-change:transform;}
.tabbar button:active{transform:scale(.95);}
.tabbar button svg{width:20px;height:20px;}
.tabbar button.active{color:var(--primary);border-color:var(--primary);background:#f0f6ff;}
.section{display:none;}
.section.active{display:block;animation:secIn .28s var(--ease);}
@keyframes secIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:7px;}
.card h3 svg{width:17px;height:17px;color:var(--primary);}
.form-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
.form-row > *{flex:1;min-width:140px;}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;}
select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);outline:none;}
.btn-primary{background:var(--primary);color:#fff;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:600;min-height:46px;width:100%;}
.btn-ghost{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14px;color:var(--text);min-height:44px;}
.btn-danger{background:#fff;border:1px solid var(--red);color:var(--red);border-radius:10px;padding:11px 14px;font-size:14px;min-height:44px;}
/* Apple：即时按压反馈（pointer-down 即响应）+ 弹簧缓动 */
.btn-primary,.btn-ghost,.btn-danger,.lv-go,.icon-btn,.dur-step,.opt,.wrong-item .acts button,.item .acts button,.account-card .ac-btn,.modal .row button,.today-item .do-btn{transition:transform .12s var(--spring),background .15s,box-shadow .15s,color .15s,border-color .15s;will-change:transform;}
.btn-primary:active,.btn-ghost:active,.btn-danger:active,.lv-go:active,.icon-btn:active,.dur-step:active,.opt:active,.wrong-item .acts button:active,.item .acts button:active,.account-card .ac-btn:active,.modal .row button:active,.today-item .do-btn:active{transform:scale(.97);}
/* quiz */
.quiz-tip{color:var(--muted);text-align:center;padding:24px 0;font-size:14px;}
.quiz-q{font-weight:600;font-size:15px;margin-bottom:4px;}
.quiz-meta{font-size:12px;color:var(--primary);background:#eef5ff;padding:2px 8px;border-radius:20px;display:inline-block;margin-bottom:12px;}
.q-type{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--primary);padding:2px 9px;border-radius:20px;margin-left:8px;vertical-align:middle;}
.opt{padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;font-size:15px;background:#fff;display:flex;align-items:center;gap:10px;}
.opt .mark{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);flex-shrink:0;}
.opt.sel{border-color:var(--primary);background:#f0f6ff;}
.opt.right{border-color:var(--green);background:#e8f9f0;}
.opt.right .mark{background:var(--green);color:#fff;border-color:var(--green);}
.opt.wrong{border-color:var(--red);background:#fdecea;}
.opt.wrong .mark{background:var(--red);color:#fff;border-color:var(--red);}
.opt .lab{font-weight:600;margin-right:2px;}
.explain{background:var(--bg);padding:11px 13px;border-radius:10px;font-size:13px;color:#465562;margin:10px 0;}
.explain b{color:var(--primary-dark);}
.quiz-acts{display:flex;gap:10px;margin-top:6px;}
.quiz-acts button{flex:1;}
/* wrong book */
.wrong-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;border-left:4px solid var(--red);}
.wrong-item .w-title{font-weight:600;font-size:14px;}
.wrong-item .w-meta{font-size:12px;color:var(--muted);margin:4px 0;}
.wrong-item .w-ans{font-size:13px;color:#465562;background:var(--bg);padding:8px 10px;border-radius:8px;margin-top:6px;}
.wrong-item .acts{margin-top:10px;}
.wrong-item .acts button{border:1px solid var(--primary);color:var(--primary);border-radius:8px;padding:8px 12px;font-size:13px;min-height:40px;}
/* stats */
.stats-grid{display:flex;flex-wrap:wrap;gap:12px;}
.stat-box{flex:1;min-width:120px;background:var(--bg);border-radius:12px;padding:14px;text-align:center;}
.stat-box .num{font-size:24px;font-weight:800;color:var(--primary);letter-spacing:-.01em;}
.stat-box .lab{font-size:12px;color:var(--muted);margin-top:3px;}
.chart-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:8px;}
.chart-legend{font-size:13px;}
.chart-legend div{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.chart-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
/* level */
.level-box{background:linear-gradient(135deg,#eef5ff,#f7faff);border:1px solid #d6e6ff;border-radius:12px;padding:14px;margin-top:6px;}
.level-group-title{font-weight:700;color:var(--text);margin:4px 0 10px;font-size:14px;}
.level-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;margin-bottom:16px;}
.lv-card{position:relative;background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s;cursor:default;}
.lv-card.open{border-color:var(--primary);box-shadow:0 4px 14px rgba(80,130,255,.12);cursor:pointer;}
.lv-card.cleared{background:linear-gradient(135deg,#eafaf0,#f4fcf7);border-color:#bfe9cf;}
.lv-card.locked{opacity:.5;filter:grayscale(.5);}
.lv-name{font-weight:800;font-size:15px;color:var(--text);line-height:1.3;letter-spacing:-.01em;}
.lv-sub{font-size:12px;color:var(--muted);margin:4px 0;}
.lv-tag{font-size:12px;font-weight:700;}
.lv-card.cleared .lv-tag{color:#27ae60;}
.lv-card.open .lv-tag{color:var(--primary);}
.lv-card.locked .lv-tag{color:#999;}
.lv-go{margin-top:8px;background:var(--primary);color:#fff;border:none;border-radius:9px;padding:9px;font-weight:700;font-size:13px;cursor:pointer;min-height:40px;}
.lv-lock{position:absolute;top:10px;right:12px;color:#bbb;}
.lv-progress{font-size:13px;color:var(--muted);margin-bottom:10px;}
.bar{height:12px;background:#e3eaf2;border-radius:20px;overflow:hidden;}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#2b7de9,#5aa0ff);border-radius:20px;transition:width .5s var(--spring);}
/* rewards */
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;}
.item .top{display:flex;align-items:flex-start;gap:10px;}
.item .title{font-weight:600;font-size:15px;flex:1;}
.item .cat{font-size:12px;color:var(--primary);background:#eef5ff;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.item .acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;}
.item .acts button{border-radius:8px;padding:8px 11px;font-size:13px;min-height:40px;border:1px solid var(--line);background:#fff;}
.act-do{border-color:var(--primary)!important;color:var(--primary)!important;}
.act-del{border-color:var(--red)!important;color:var(--red)!important;}
/* notice/modal/toast */
.notice{background:#fff8e6;border:1px solid #f5e0a3;color:#9a7600;border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.notice svg{width:16px;height:16px;flex-shrink:0;}
.modal-mask{position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:50;display:none;align-items:safe center;justify-content:center;padding:18px;overflow-y:auto;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
.modal-mask.show{display:flex;animation:maskIn .28s ease;}
.modal{background:#fff;border-radius:20px;padding:20px;max-width:360px;width:100%;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform-origin:center;animation:modalIn .34s var(--spring);will-change:transform,opacity;}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal h4{margin:0 0 10px;font-size:16px;}
.modal p{font-size:14px;color:#465562;margin:0 0 16px;}
.modal .row{display:flex;gap:10px;}
.modal .row button{flex:1;border-radius:10px;padding:12px;font-size:15px;font-weight:600;min-height:46px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;}
.modal-x{flex:0 0 auto;width:34px;height:34px;border:none;background:#eef2f6;color:#465562;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;padding:0;}
.modal-x:active{background:#dfe6ec;}
.switch{position:relative;display:inline-block;width:46px;height:26px;flex:0 0 auto;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:#cfd8e3;border-radius:26px;transition:.2s;}
.switch .slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked + .slider{background:var(--primary);}
.switch input:checked + .slider:before{transform:translateX(20px);}
.m-ok{background:var(--red);color:#fff;}
.m-cancel{background:var(--bg);color:var(--text);border:1px solid var(--line);}
.footer-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.footer-tools button{flex:1;min-width:150px;}
@media(max-width:768px){
  .tabbar{position:fixed;bottom:0;top:auto;left:0;right:0;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));margin:0;box-shadow:0 -2px 12px rgba(30,50,90,.08);}
  .tabbar button{min-height:50px;}
  .container{padding:66px 12px 92px;}
  .icon-btn span{display:none;}
  .header-right .icon-btn{padding:8px;}
  .header-right .icon-btn svg{width:18px;height:18px;}
  .balance{font-size:13px;padding:6px 8px;}
}
/* ===== 账户卡 / 积分快览 ===== */
.account-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#f0f6ff,#e9f3ff);border:1px solid #cfe0fa;border-radius:12px;padding:14px 16px;}
.account-card .avatar{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0;}
.account-card .ac-info{flex:1;min-width:0;}
.account-card .ac-name{font-size:16px;font-weight:700;color:var(--primary-dark);}
.account-card .ac-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.account-card .ac-btn{border:1px solid var(--primary);color:var(--primary);background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;min-height:40px;}
.points-quick{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#fff8e6,#fff3d6);border:1px solid #f5e0a3;border-radius:12px;padding:12px 16px;}
.points-quick .pq-icon{width:36px;height:36px;border-radius:50%;background:#f39c12;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.points-quick .pq-icon svg{width:20px;height:20px;}
.points-quick .pq-info{flex:1;min-width:0;}
.points-quick .pq-num{font-size:22px;font-weight:800;color:#9a7600;line-height:1;}
.points-quick .pq-lab{font-size:12px;color:#9a7600;margin-top:3px;}
/* ===== 计时模式 ===== */
.dur-picker{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0 4px;}
.dur-step{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;font-weight:700;color:var(--primary);cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .15s;user-select:none;-webkit-user-select:none;}
.dur-step:active{transform:scale(.92);background:#f0f6ff;}
.dur-val{display:flex;align-items:baseline;gap:4px;min-width:96px;justify-content:center;}
.dur-val #durNum{font-size:42px;font-weight:800;color:var(--primary-dark);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.dur-val .dur-unit{font-size:15px;color:var(--muted);}
.dur-range{width:100%;margin:8px 0 16px;accent-color:var(--primary);cursor:pointer;}
.timed-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(135deg,#fff7e6,#ffeed1);border:1px solid #f5e0a3;border-radius:12px;padding:13px 16px;margin-bottom:14px;}
.timed-clock{font-size:30px;font-weight:800;color:#9a7600;font-variant-numeric:tabular-nums;line-height:1;}
.timed-score{display:flex;gap:14px;font-size:13px;color:#9a7600;align-items:center;}
.timed-score b{font-size:18px;color:#9a7600;font-weight:800;}
.timed-score .ts-btn{padding:6px 12px;font-size:12px;border-radius:8px;background:#fff;border:1px solid #f5e0a3;color:#9a7600;cursor:pointer;}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 14px;}
.result-item{background:var(--bg);border-radius:12px;padding:14px;text-align:center;}
.result-item .num{font-size:26px;font-weight:800;color:var(--primary);}
.result-item .lab{font-size:12px;color:var(--muted);margin-top:3px;}
/* ===== 刷题记录 ===== */
.rec-group{margin-bottom:14px;}
.rec-group h4{font-size:14px;color:var(--primary-dark);margin:0 0 8px;display:flex;align-items:center;gap:6px;}
.rec-group h4 .rec-tag{font-size:11px;background:var(--primary);color:#fff;padding:2px 7px;border-radius:20px;font-weight:600;}
.rec-list{background:var(--bg);border-radius:12px;padding:8px 10px;}
.rec-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px;}
.rec-item:last-child{border-bottom:none;}
.rec-item .ri-rank{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.rec-item .ri-count{font-weight:700;color:var(--primary-dark);min-width:42px;}
.rec-item .ri-right{color:#2ecc71;min-width:34px;}
.rec-item .ri-rate{color:var(--muted);min-width:38px;}
.rec-item .ri-date{margin-left:auto;color:var(--muted);font-size:11px;}
.rec-empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0;}
/* ===== 合并错题（知识点+实验） ===== */
.wrong-tabs{display:flex;gap:6px;margin-bottom:10px;}
.wrong-tab{flex:1;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--muted);text-align:center;}
.wrong-tab.active{color:var(--primary);border-color:var(--primary);background:#f0f6ff;}
/* ===== 背诵卡 ===== */
/* ===== Apple：减弱动态效果（无障碍） ===== */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
  .modal-mask.show .modal,.section.active,.tabbar button:active,.btn-primary:active,.btn-ghost:active,.btn-danger:active,.lv-go:active,.icon-btn:active,.dur-step:active,.opt:active,.wrong-item .acts button:active,.item .acts button:active,.account-card .ac-btn:active,.modal .row button:active,.today-item .do-btn:active{transform:none!important;}
  header,.tabbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.96);}
}
</style>
</head>
<body>
<header>
  <div class="logo">

<div class="container">


  <nav class="tabbar">

    <button data-tab="timed">

      我的
    </button>
