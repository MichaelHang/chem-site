<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>高中化学练习台 · 人教版浙江高考</title>
<style>
:root{
  --primary:#2b7de9; --primary-dark:#1c5fb8; --green:#2ecc71; --red:#e74c3c; --orange:#f39c12;
  --bg:#f5f7fa; --card:#fff; --text:#1f2a37; --muted:#7a8794; --line:#e6eaef; --radius:14px; --shadow:0 2px 10px rgba(30,50,90,.06);
  --spring:cubic-bezier(.34,1.42,.64,1); --ease:cubic-bezier(.32,.72,0,1);
  --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.85);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;font-optical-sizing:auto;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;}
header{position:fixed;top:0;left:0;right:0;height:56px;z-index:30;background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--primary-dark);}
.logo svg{width:24px;height:24px;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.balance{display:flex;align-items:center;gap:5px;background:#fff7e6;color:var(--orange);font-weight:700;padding:6px 10px;border-radius:20px;font-size:14px;white-space:nowrap;}
.balance svg{width:16px;height:16px;}
.icon-btn{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--text);min-height:40px;}
.icon-btn svg{width:16px;height:16px;}
.container{max-width:920px;margin:0 auto;padding:66px 14px 30px;}
.today{background:linear-gradient(135deg,#fff,#fbfdff);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow);}
.today h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:7px;}
.today h2 svg{width:18px;height:18px;color:var(--primary);}
.today .empty{color:var(--muted);font-size:14px;padding:6px 0;}
.today-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:#fff;border:1px solid var(--line);margin-bottom:8px;}
.today-item:last-child{margin-bottom:0;}
.today-item .tag{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--muted);white-space:nowrap;}
.today-item.overdue{border-color:#f5c6c0;background:#fff5f3;}
.today-item.overdue .tag{background:var(--red);color:#fff;}
.today-item.soon .tag{background:var(--orange);color:#fff;}
.today-item .ti-main{flex:1;min-width:0;}
.today-item .ti-title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.today-item.overdue .ti-title{color:var(--red);}
.today-item .ti-sub{font-size:12px;color:var(--muted);}
.today-item .do-btn{background:var(--primary);color:#fff;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:600;white-space:nowrap;min-height:40px;}
.prog-grid{display:flex;gap:14px;flex-wrap:wrap;}
.prog-rank{flex:1;min-width:200px;background:linear-gradient(135deg,#eef5ff,#f7faff);border:1px solid #d6e6ff;border-radius:12px;padding:14px;}
.prog-rank .rank-name{font-size:20px;font-weight:800;color:var(--primary-dark);letter-spacing:-.01em;}
.prog-rank .rank-sub{font-size:13px;color:var(--muted);margin:3px 0 10px;}
.prog-stats{flex:1;min-width:200px;display:flex;gap:8px;align-items:center;justify-content:space-around;}
.prog-stats .ps{display:flex;flex-direction:column;align-items:center;flex:1;}
.prog-stats .ps span{font-size:24px;font-weight:800;color:var(--primary);letter-spacing:-.01em;}
.prog-stats .ps small{font-size:12px;color:var(--muted);margin-top:3px;}
.prog-todo{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
.todo-head{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.todo-head b{color:var(--red);}
.todo-hint{font-size:12px;color:var(--muted);font-weight:400;}
.tabbar{position:sticky;top:56px;z-index:20;background:rgba(245,247,250,.78);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);display:flex;gap:6px;padding:8px 0;margin-bottom:14px;}
.tabbar button{flex:1;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 4px;font-size:14px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;transition:transform .12s var(--spring),background .18s,color .18s,border-color .18s;will-change:transform;}
.tabbar button:active{transform:scale(.95);}
.tabbar button svg{width:20px;height:20px;}
.tabbar button.active{color:var(--primary);border-color:var(--primary);background:#f0f6ff;}
.section{display:none;}
.section.active{display:block;animation:secIn .28s var(--ease);}
@keyframes secIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:7px;}
.card h3 svg{width:17px;height:17px;color:var(--primary);}
.form-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
.form-row > *{flex:1;min-width:140px;}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;}
select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);outline:none;}
.btn-primary{background:var(--primary);color:#fff;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:600;min-height:46px;width:100%;}
.btn-ghost{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14px;color:var(--text);min-height:44px;}
.btn-danger{background:#fff;border:1px solid var(--red);color:var(--red);border-radius:10px;padding:11px 14px;font-size:14px;min-height:44px;}
/* Apple：即时按压反馈（pointer-down 即响应）+ 弹簧缓动 */
.btn-primary,.btn-ghost,.btn-danger,.lv-go,.icon-btn,.dur-step,.opt,.wrong-item .acts button,.item .acts button,.account-card .ac-btn,.modal .row button,.today-item .do-btn{transition:transform .12s var(--spring),background .15s,box-shadow .15s,color .15s,border-color .15s;will-change:transform;}
.btn-primary:active,.btn-ghost:active,.btn-danger:active,.lv-go:active,.icon-btn:active,.dur-step:active,.opt:active,.wrong-item .acts button:active,.item .acts button:active,.account-card .ac-btn:active,.modal .row button:active,.today-item .do-btn:active{transform:scale(.97);}
/* quiz */
.quiz-tip{color:var(--muted);text-align:center;padding:24px 0;font-size:14px;}
.quiz-q{font-weight:600;font-size:15px;margin-bottom:4px;}
.quiz-meta{font-size:12px;color:var(--primary);background:#eef5ff;padding:2px 8px;border-radius:20px;display:inline-block;margin-bottom:12px;}
.q-type{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--primary);padding:2px 9px;border-radius:20px;margin-left:8px;vertical-align:middle;}
.opt{padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;font-size:15px;background:#fff;display:flex;align-items:center;gap:10px;}
.opt .mark{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);flex-shrink:0;}
.opt.sel{border-color:var(--primary);background:#f0f6ff;}
.opt.right{border-color:var(--green);background:#e8f9f0;}
.opt.right .mark{background:var(--green);color:#fff;border-color:var(--green);}
.opt.wrong{border-color:var(--red);background:#fdecea;}
.opt.wrong .mark{background:var(--red);color:#fff;border-color:var(--red);}
.opt .lab{font-weight:600;margin-right:2px;}
.explain{background:var(--bg);padding:11px 13px;border-radius:10px;font-size:13px;color:#465562;margin:10px 0;}
.explain b{color:var(--primary-dark);}
.quiz-acts{display:flex;gap:10px;margin-top:6px;}
.quiz-acts button{flex:1;}
/* wrong book */
.wrong-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;border-left:4px solid var(--red);}
.wrong-item .w-title{font-weight:600;font-size:14px;}
.wrong-item .w-meta{font-size:12px;color:var(--muted);margin:4px 0;}
.wrong-item .w-ans{font-size:13px;color:#465562;background:var(--bg);padding:8px 10px;border-radius:8px;margin-top:6px;}
.wrong-item .acts{margin-top:10px;}
.wrong-item .acts button{border:1px solid var(--primary);color:var(--primary);border-radius:8px;padding:8px 12px;font-size:13px;min-height:40px;}
/* stats */
.stats-grid{display:flex;flex-wrap:wrap;gap:12px;}
.stat-box{flex:1;min-width:120px;background:var(--bg);border-radius:12px;padding:14px;text-align:center;}
.stat-box .num{font-size:24px;font-weight:800;color:var(--primary);letter-spacing:-.01em;}
.stat-box .lab{font-size:12px;color:var(--muted);margin-top:3px;}
.chart-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:8px;}
.chart-legend{font-size:13px;}
.chart-legend div{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.chart-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
/* level */
.level-box{background:linear-gradient(135deg,#eef5ff,#f7faff);border:1px solid #d6e6ff;border-radius:12px;padding:14px;margin-top:6px;}
.level-group-title{font-weight:700;color:var(--text);margin:4px 0 10px;font-size:14px;}
.level-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;margin-bottom:16px;}
.lv-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s;cursor:default;}
.lv-card.open{border-color:var(--primary);box-shadow:0 4px 14px rgba(80,130,255,.12);cursor:pointer;}
.lv-card.cleared{background:linear-gradient(135deg,#eafaf0,#f4fcf7);border-color:#bfe9cf;}
.lv-card.locked{opacity:.5;filter:grayscale(.5);}
.lv-name{font-weight:800;font-size:15px;color:var(--text);line-height:1.3;letter-spacing:-.01em;}
.lv-sub{font-size:12px;color:var(--muted);margin:4px 0;}
.lv-tag{font-size:12px;font-weight:700;}
.lv-card.cleared .lv-tag{color:#27ae60;}
.lv-card.open .lv-tag{color:var(--primary);}
.lv-card.locked .lv-tag{color:#999;}
.lv-go{margin-top:8px;background:var(--primary);color:#fff;border:none;border-radius:9px;padding:9px;font-weight:700;font-size:13px;cursor:pointer;min-height:40px;}
.lv-lock{position:absolute;top:10px;right:12px;color:#bbb;}
.lv-progress{font-size:13px;color:var(--muted);margin-bottom:10px;}
.bar{height:12px;background:#e3eaf2;border-radius:20px;overflow:hidden;}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#2b7de9,#5aa0ff);border-radius:20px;transition:width .5s var(--spring);}
/* rewards */
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;}
.item .top{display:flex;align-items:flex-start;gap:10px;}
.item .title{font-weight:600;font-size:15px;flex:1;}
.item .cat{font-size:12px;color:var(--primary);background:#eef5ff;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.item .acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;}
.item .acts button{border-radius:8px;padding:8px 11px;font-size:13px;min-height:40px;border:1px solid var(--line);background:#fff;}
.act-do{border-color:var(--primary)!important;color:var(--primary)!important;}
.act-del{border-color:var(--red)!important;color:var(--red)!important;}
/* notice/modal/toast */
.notice{background:#fff8e6;border:1px solid #f5e0a3;color:#9a7600;border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.notice svg{width:16px;height:16px;flex-shrink:0;}
.modal-mask{position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:50;display:none;align-items:safe center;justify-content:center;padding:18px;overflow-y:auto;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
.modal-mask.show{display:flex;animation:maskIn .28s ease;}
.modal{background:#fff;border-radius:20px;padding:20px;max-width:360px;width:100%;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform-origin:center;animation:modalIn .34s var(--spring);will-change:transform,opacity;}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal h4{margin:0 0 10px;font-size:16px;}
.modal p{font-size:14px;color:#465562;margin:0 0 16px;}
.modal .row{display:flex;gap:10px;}
.modal .row button{flex:1;border-radius:10px;padding:12px;font-size:15px;font-weight:600;min-height:46px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;}
.modal-x{flex:0 0 auto;width:34px;height:34px;border:none;background:#eef2f6;color:#465562;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;padding:0;}
.modal-x:active{background:#dfe6ec;}
.switch{position:relative;display:inline-block;width:46px;height:26px;flex:0 0 auto;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:#cfd8e3;border-radius:26px;transition:.2s;}
.switch .slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked + .slider{background:var(--primary);}
.switch input:checked + .slider:before{transform:translateX(20px);}
.m-ok{background:var(--red);color:#fff;}
.m-cancel{background:var(--bg);color:var(--text);border:1px solid var(--line);}
.footer-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.footer-tools button{flex:1;min-width:150px;}
@media(max-width:768px){
  .tabbar{position:fixed;bottom:0;top:auto;left:0;right:0;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));margin:0;box-shadow:0 -2px 12px rgba(30,50,90,.08);}
  .tabbar button{min-height:50px;}
  .container{padding:66px 12px 92px;}
  .icon-btn span{display:none;}
  .header-right .icon-btn{padding:8px;}
  .header-right .icon-btn svg{width:18px;height:18px;}
  .balance{font-size:13px;padding:6px 8px;}
}
/* ===== 账户卡 / 积分快览 ===== */
.account-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#f0f6ff,#e9f3ff);border:1px solid #cfe0fa;border-radius:12px;padding:14px 16px;}
.account-card .avatar{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0;}
.account-card .ac-info{flex:1;min-width:0;}
.account-card .ac-name{font-size:16px;font-weight:700;color:var(--primary-dark);}
.account-card .ac-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.account-card .ac-btn{border:1px solid var(--primary);color:var(--primary);background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;min-height:40px;}
.points-quick{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#fff8e6,#fff3d6);border:1px solid #f5e0a3;border-radius:12px;padding:12px 16px;}
.points-quick .pq-icon{width:36px;height:36px;border-radius:50%;background:#f39c12;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.points-quick .pq-icon svg{width:20px;height:20px;}
.points-quick .pq-info{flex:1;min-width:0;}
.points-quick .pq-num{font-size:22px;font-weight:800;color:#9a7600;line-height:1;}
.points-quick .pq-lab{font-size:12px;color:#9a7600;margin-top:3px;}
/* ===== 计时模式 ===== */
.dur-picker{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0 4px;}
.dur-step{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;font-weight:700;color:var(--primary);cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .15s;user-select:none;-webkit-user-select:none;}
.dur-step:active{transform:scale(.92);background:#f0f6ff;}
.dur-val{display:flex;align-items:baseline;gap:4px;min-width:96px;justify-content:center;}
.dur-val #durNum{font-size:42px;font-weight:800;color:var(--primary-dark);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.dur-val .dur-unit{font-size:15px;color:var(--muted);}
.dur-range{width:100%;margin:8px 0 16px;accent-color:var(--primary);cursor:pointer;}
.timed-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(135deg,#fff7e6,#ffeed1);border:1px solid #f5e0a3;border-radius:12px;padding:13px 16px;margin-bottom:14px;}
.timed-clock{font-size:30px;font-weight:800;color:#9a7600;font-variant-numeric:tabular-nums;line-height:1;}
.timed-score{display:flex;gap:14px;font-size:13px;color:#9a7600;align-items:center;}
.timed-score b{font-size:18px;color:#9a7600;font-weight:800;}
.timed-score .ts-btn{padding:6px 12px;font-size:12px;border-radius:8px;background:#fff;border:1px solid #f5e0a3;color:#9a7600;cursor:pointer;}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 14px;}
.result-item{background:var(--bg);border-radius:12px;padding:14px;text-align:center;}
.result-item .num{font-size:26px;font-weight:800;color:var(--primary);}
.result-item .lab{font-size:12px;color:var(--muted);margin-top:3px;}
/* ===== 刷题记录 ===== */
.rec-group{margin-bottom:14px;}
.rec-group h4{font-size:14px;color:var(--primary-dark);margin:0 0 8px;display:flex;align-items:center;gap:6px;}
.rec-group h4 .rec-tag{font-size:11px;background:var(--primary);color:#fff;padding:2px 7px;border-radius:20px;font-weight:600;}
.rec-list{background:var(--bg);border-radius:12px;padding:8px 10px;}
.rec-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px;}
.rec-item:last-child{border-bottom:none;}
.rec-item .ri-rank{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.rec-item .ri-count{font-weight:700;color:var(--primary-dark);min-width:42px;}
.rec-item .ri-right{color:#2ecc71;min-width:34px;}
.rec-item .ri-rate{color:var(--muted);min-width:38px;}
.rec-item .ri-date{margin-left:auto;color:var(--muted);font-size:11px;}
.rec-empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0;}
/* ===== 合并错题（知识点+实验） ===== */
.wrong-tabs{display:flex;gap:6px;margin-bottom:10px;}
.wrong-tab{flex:1;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--muted);text-align:center;}
.wrong-tab.active{color:var(--primary);border-color:var(--primary);background:#f0f6ff;}
/* ===== 背诵卡 ===== */
/* ===== Apple：减弱动态效果（无障碍） ===== */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
  .modal-mask.show .modal,.section.active,.tabbar button:active,.btn-primary:active,.btn-ghost:active,.btn-danger:active,.lv-go:active,.icon-btn:active,.dur-step:active,.opt:active,.wrong-item .acts button:active,.item .acts button:active,.account-card .ac-btn:active,.modal .row button:active,.today-item .do-btn:active{transform:none!important;}
  header,.tabbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.96);}
}
</style>
</head>
<body>
<header>
  <div class="logo">

<script src="bank.js"></script>
<script>
/* 计时模式状态（提前声明，避免初始化 renderAll 时的暂时性死区 TDZ） */
const DUR_MIN = 1, DUR_MAX = 10, DUR_DEFAULT = 5;
let TIMED = null;
let TIMED_INTERVAL = null;
let TIMED_DURATION = DUR_DEFAULT; /* 初始即默认时长，避免未走 renderAll 时停在 0 */
/* BANK 由 RAW_BANK 过滤「已删除题目」后动态构建，删除题目后 rebuildAll() 即可生效且刷新持久。
   注意：buildBank 调用需放在 K 定义之后（见下方 LEVELS 附近），因它依赖 K.del。 */
function buildBank(){
  const d = new Set(getArr(K.del));
  const b = {};
  ['knowledge','experiment'].forEach(k=> b[k] = RAW_BANK[k].filter(q=>!d.has(q.id)));
  return b;
}
const MODULES = {knowledge:['必修一·基本概念','必修二','选择性必修1·反应原理','选择性必修2·物质结构与性质','选择性必修3·有机化学'], experiment:['必修一','必修二','选择性必修1','选择性必修2','选择性必修3']};
/* ===== 存储 ===== */
const K = {records:'records', points:'points', rewards:'rewards', levels:'levels', del:'wb_chem_deleted', flash:'flash', practice:'practice', dev:'wb_chem_dev'};
const MEM={}; // 应用数据内存存储；服务器为唯一数据源，刷新即从云端重新拉取
function getArr(key){
  if(key===K.del){ try{ return JSON.parse(localStorage.getItem(key))||[]; }catch(e){ return []; } } // 全局"已删题目"集合须跨刷新保留，例外沿用 localStorage
  try{ return JSON.parse(MEM[key]||'null')||[]; }catch(e){ return []; }
}
/* ===== 账户与云端（地基·阶段0） ===== */
const SESS_KEY='wb_chem_session', UK_PREFIX='wb_chem_u_';
function sessionUser(){ try{ return JSON.parse(localStorage.getItem(SESS_KEY))||null; }catch(e){ return null; } }
function setSession(u){ if(u) localStorage.setItem(SESS_KEY, JSON.stringify(u)); else localStorage.removeItem(SESS_KEY); }
/* 密码哈希：纯 JS（cyrb53），过渡方案——避免明文存储/传输；真安全需 HTTPS + 后端加盐哈希 */
function cyrb53(str, seed){ let h1=0xdeadbeef^seed, h2=0x41c6ce57^seed; for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); } h1=Math.imul(h1^(h1>>>16),2246822507); h1^=Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507); h2^=Math.imul(h1^(h1>>>13),3266489909); return 4294967296*(2097151&h2)+(h1>>>0); }
function pwHash(pw, salt){ const h1=cyrb53(pw, 0x9e3779b9 ^ (salt||'').length); const h2=cyrb53(pw+(salt||''), 0x85ebca6b); return ((h1>>>0).toString(16))+'-'+((h2>>>0).toString(16)); }
/* 当前用户的数据键：未登录时用 __none__ 占位（仅兜底，正常必有登录态） */
function ukey(base){ const u=sessionUser(); return UK_PREFIX + (u||'__none__') + '_' + base; }
/* 本地账户/本地注册登录已移除：认证强制走服务器（见 serverRegister/serverLogin），服务器为唯一数据源 */
function logout(){ setSession(null); setToken(''); }
/* ===== 云端同步（阶段1 实现） =====
   模式：DEFAULT_SERVER_URL 为空 = 纯本地（阶段0 行为，不破坏）；非空 = 走自建后端。
   生产默认用 location.origin（同页同源的绝对地址）：既开启云端同步，又因与页面同协议/同域
   而避免混合内容（HTTPS 页不再去请求 HTTP 接口，杜绝之前的 Load failed）。本地测试仍可加
   ?server=http://127.0.0.1:3000 覆盖。安全：密码经 cyrb53→cred 过网；服务端 scrypt 加盐哈希；
   Bearer token 30天。 */
const DEFAULT_SERVER_URL = location.origin;
const SERVER_USER_RE = /^[a-zA-Z0-9_]{3,20}$/;
function serverURL(){
  try{ const q=new URLSearchParams(location.search).get('server'); if(q) return q.replace(/\/$/,''); }catch(e){}
  return DEFAULT_SERVER_URL;
}
function credOf(pw){ return String(cyrb53(pw)>>>0); } // 与后端 scrypt(cred) 契约一致
const TOKEN_KEY='wb_chem_token';
function getToken(){ try{ return localStorage.getItem(TOKEN_KEY)||''; }catch(e){ return ''; } }
function setToken(t){ if(t) localStorage.setItem(TOKEN_KEY,t); else localStorage.removeItem(TOKEN_KEY); }
/* 登录过期处理：同步接口返回 401（token 过期/失效）时自动登出并弹出登录框。
   避免界面"假装已登录"、数据显示为空而用户不知情。云端数据不受影响，重新登录即恢复同步。 */
let _authExpiredHandled=false;
function handleAuthExpired(){
  if(!sessionUser() || _authExpiredHandled) return;
  _authExpiredHandled=true;
  /* 先以当前用户身份清空本地内存数据（防止残留数据串到下一个登录的账户），再登出 */
  ['records','points','rewards','levels','flash','practice','timed'].forEach(b=>setArr(ukey(b),[]));
  logout();
  renderAll();
  if(TIMED_INTERVAL){ toast('登录已过期，本轮成绩不会同步；结束后请重新登录'); return; }
  openAuth('login');
  const m=document.getElementById('authMsg'); if(m) m.textContent='登录已过期，请重新登录';
}
async function apiFetch(pathname, method, body){
  const base=serverURL(); if(!base) return {code:0, ok:false, msg:'本地模式'};
  const headers={'Content-Type':'application/json'}; const tk=getToken(); if(tk) headers['Authorization']='Bearer '+tk;
  const opt={method, headers}; if(body) opt.body=JSON.stringify(body);
  const resp=await fetch(base+pathname, opt); let data={};
  try{ data=await resp.json(); }catch(e){}
  if(resp.status===401 && pathname.startsWith('/api/sync')) handleAuthExpired();
  return Object.assign({code:resp.status, ok:resp.status>=200&&resp.status<300}, data);
}
async function serverRegister(user, pw){
  user=(user||'').trim();
  if(!SERVER_USER_RE.test(user)) return {ok:false,msg:'用户名需 3-20 位字母/数字/下划线'};
  try{
    const r=await apiFetch('/api/register','POST',{user, cred:credOf(pw)});
    if(!r.ok) return {ok:false,msg:r.msg||'注册失败'};
    setToken(r.token); setSession(user); return {ok:true};
  }catch(e){ return {ok:false,msg:'网络错误：'+(e&&e.message||e)}; }
}
async function serverLogin(user, pw){
  user=(user||'').trim();
  const cred=credOf(pw);
  try{
    let r=await apiFetch('/api/login','POST',{user, cred});
    if(r.ok){ setToken(r.token); setSession(user); return {ok:true}; }
    if(r.code===404){ // 未知用户 → 首次以 server 登录自动建账户（后端自动注册，无需重输密码）
      const r2=await apiFetch('/api/register','POST',{user, cred});
      if(!r2.ok) return {ok:false,msg:r2.msg||'自动注册失败'};
      setToken(r2.token); setSession(user); return {ok:true};
    }
    return {ok:false,msg:r.msg||'登录失败'};
  }catch(e){ return {ok:false,msg:'网络错误：'+(e&&e.message||e)}; }
}
/* 推送当前用户全部进度到云端（server 模式）；本地模式无操作。
   串行化：recordAnswer→addPoints 等会连续触发 syncUp，并发 POST 时服务端按
   client_ts vs updated_at 拒收"数据更全但时间戳稍早"的推送，导致云端丢数据。
   队列保证最后一次推送携带最终数据，且其时间戳晚于前一次服务端落库时间。 */
let _syncUpQueue=Promise.resolve();
function syncUp(){
  _syncUpQueue=_syncUpQueue.then(async ()=>{
    const srv=serverURL(); if(!srv) return;
    const u=sessionUser(); if(!u) return;
    const data={}; const ts=Date.now();
    ['records','points','rewards','levels','flash','practice','timed'].forEach(b=>{ data[b]=getArr(ukey(b)); });
    try{ const r=await apiFetch('/api/sync','POST',{client_ts:ts, data}); if(!r.ok) console.warn('[syncUp] 失败', r.msg); }
    catch(e){ console.warn('[syncUp] 异常', e&&e.message||e); }
  });
  return _syncUpQueue;
}
/* 从云端拉取当前用户进度并写回本地（server 模式）；本地模式无操作。返回是否成功 */
async function syncDown(){
  const srv=serverURL(); if(!srv) return false;
  const u=sessionUser(); if(!u) return false;
  try{
    const r=await apiFetch('/api/sync','GET');
    if(!r.ok){ console.warn('[syncDown] 失败', r.msg); return false; }
    const data=r.data||{};
    ['records','points','rewards','levels','flash','practice','timed'].forEach(b=>{ if(data[b]!==undefined) setArr(ukey(b), data[b]); });
    return true;
  }catch(e){ console.warn('[syncDown] 异常', e&&e.message||e); return false; }
}
/* 自动同步（server 模式）：先推本地（若有未同步数据），再拉云端最新；本地模式/未登录无操作。返回是否成功拉取 */
async function autoSync(){
  const srv=serverURL(); if(!srv) return false;
  const u=sessionUser(); if(!u) return false;
  const bases=['records','points','rewards','levels','flash','practice','timed'];
  if(bases.some(b=>getArr(ukey(b)).length>0)) await syncUp();
  return await syncDown();
}
let authMode='login';
function setArr(key,arr){ if(key===K.del){ localStorage.setItem(key, JSON.stringify(arr)); return; } MEM[key]=JSON.stringify(arr); }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return fmtDate(new Date()); }
function dOffset(n){ const d=new Date(); d.setDate(d.getDate()+n); return fmtDate(d); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function qTypeTag(q){ return (q&&q.type)?('<span class="q-type">'+esc(q.type)+'</span>'):''; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ===== 积分 ===== */
function balance(){
  let b=0; getArr(ukey('points')).forEach(p=>{ b += (p.type==='earn'?1:-1)*Number(p.amount||0); }); return b;
}
function addPoints(type,amount,reason){ const ps=getArr(ukey('points')); ps.push({id:uid(),type,amount:Number(amount),reason,date:todayStr()}); setArr(ukey('points'),ps); syncUp(); }
function balanceSeries(){
  const ps=[...getArr(ukey('points'))].sort((a,b)=>a.date<b.date?-1:1);
  let run=0; const map={}; ps.forEach(p=>{ run += (p.type==='earn'?1:-1)*Number(p.amount||0); map[p.date]=run; });
  return Object.keys(map).sort().map(d=>({date:d,value:map[d]}));
}

/* ===== 关卡（按模块自动分组，顺序解锁） ===== */
function buildLevels(){
  const lv=[];
  [['knowledge',BANK.knowledge],['experiment',BANK.experiment]].forEach(([bank,src])=>{
    const groups={};
    src.forEach(q=>{ (groups[q.module]=groups[q.module]||[]).push(q.id); });
    const order=MODULES[bank]||[];
    // 按 MODULES 指定顺序生成关卡，跳过无题模块
    order.forEach(mod=>{ if(groups[mod]&&groups[mod].length) lv.push({id:bank+'::'+mod,bank,module:mod,qids:groups[mod],pass:0.6}); });
    // 兜底：列出 MODULES 之外的模块（理论上不会发生）
    Object.keys(groups).forEach(mod=>{ if(order.indexOf(mod)<0) lv.push({id:bank+'::'+mod,bank,module:mod,qids:groups[mod],pass:0.6}); });
  });
  return lv;
}
let BANK = buildBank();
let LEVELS = buildLevels();
function getQ(bank,id){ return BANK[bank].find(x=>x.id===id); }
function rebuildAll(){ BANK = buildBank(); LEVELS = buildLevels(); }
function isDev(){ return false; }
/* 永久删除某道题：
   1) 从源头 RAW_BANK 中移除该元素（本次会话即时、彻底）；
   2) 记入 K.del 持久化，刷新/重载后仍会过滤；
   3) 「清空全部数据」不会清除 K.del，因此删除的题目永远无法恢复。 */
function deleteQuestion(bank,id){
  const arr = RAW_BANK[bank];
  const i = arr.findIndex(x=>x.id===id);
  if(i>=0) arr.splice(i,1);
  const ds=getArr(K.del); if(!ds.includes(id)) ds.push(id); setArr(K.del,ds);
  rebuildAll();
  setArr(ukey('records'), getArr(ukey('records')).filter(r=>r.qid!==id)); syncUp();
  toast('已永久删除该题目');
  renderAll();
}
function getLevelState(id){
  const all=getArr(ukey('levels')); const s=all.find(x=>x.id===id);
  return s||{cleared:false,best:0,correct:0,total:0,plays:0};
}
/* 存入的状态必须带 id 才能被 getLevelState 查回（历史版本曾丢失 id 导致模块通关状态读不回、后续模块永久锁死）；
   顺带丢弃无 id 的历史脏数据 */
function saveLevelState(id,st){ const all=getArr(ukey('levels')).filter(x=>x.id!==id&&x.id); all.push({...st,id}); setArr(ukey('levels'),all); syncUp(); }
function levelUnlocked(lv,list){
  if(isDev()) return true;
  const same=list.filter(x=>x.bank===lv.bank);
  const i=same.indexOf(lv);
  if(i<=0) return true;
  return getLevelState(same[i-1].id).cleared;
}

/* ===== 答题记录 + 积分（仅"首次答对"给分，杜绝重复刷分） ===== */
function recordAnswer(bank, q, correct){
  if(isDev()) return false;
  const recs=getArr(ukey('records'));
  const priorCorrect = recs.some(r=>r.qid===q.id && r.correct); // 本次之前是否已答对过该题
  recs.push({id:uid(),bank,qid:q.id,correct,date:todayStr(),score:correct?5:0});
  setArr(ukey('records'),recs);
  let awarded=false;
  if(correct && !priorCorrect){ addPoints('earn',5,'答对：'+q.q.replace(/[？?]。*$/,'。')); awarded=true; }
  syncUp();
  return awarded;
}
/* ===== 段位（掌握度驱动：已掌握去重题数 / 总题数，随题库自动缩放） ===== */
function totalQuestions(){ return (BANK.knowledge?BANK.knowledge.length:0)+(BANK.experiment?BANK.experiment.length:0); }
function masteredCount(){
  const valid=new Set(); (BANK.knowledge||[]).forEach(q=>valid.add(q.id)); (BANK.experiment||[]).forEach(q=>valid.add(q.id));
  const s=new Set();
  getArr(ukey('records')).forEach(r=>{ if(r.correct && valid.has(r.qid)) s.add(r.qid); });
  return s.size;
}
function rankOf(){
  const total=totalQuestions(), m=masteredCount();
  const tiers=[{name:'青铜',p:0},{name:'白银',p:0.10},{name:'黄金',p:0.30},{name:'铂金',p:0.60},{name:'钻石',p:0.90}];
  let cur=tiers[0], next=null;
  for(let i=0;i<tiers.length;i++){ if(m>=Math.ceil(total*tiers[i].p)){ cur=tiers[i]; next=tiers[i+1]||null; } }
  return {name:cur.name, mastered:m, total, curNeed:Math.ceil(total*cur.p), nextNeed:next?Math.ceil(total*next.p):null, nextName:next?next.name:null};
}

/* ===== 出题 ===== */
let SESSION_PLAYED = {knowledge:new Set(), experiment:new Set()};
function pickQuestion(bank, moduleFilter, forcedQid){
  if(forcedQid){ const q=BANK[bank].find(x=>x.id===forcedQid); return q||null; }
  let pool = BANK[bank];
  if(moduleFilter) pool = pool.filter(q=>q.module===moduleFilter);
  // 优先未在本轮练过的
  let avail = pool.filter(q=>!SESSION_PLAYED[bank].has(q.id));
  if(!avail.length){ SESSION_PLAYED[bank]=new Set(); avail = pool; }
  if(!avail.length) return null;
  return avail[Math.floor(Math.random()*avail.length)];
}
function renderQuiz(bank, q){
  const box = document.getElementById('mineQuiz');
  if(!q){ box.innerHTML='<div class="quiz-tip">题目未找到</div>'; return; }
  SESSION_PLAYED[bank].add(q.id);
  const letters=['A','B','C','D'];
  box.innerHTML = `
    <div class="quiz-meta">${esc(q.module)}${qTypeTag(q)}<span style="margin-left:6px;background:#f0f6ff;color:var(--primary);font-size:11px;padding:1px 7px;border-radius:20px;">${bank==='knowledge'?'知识点':'实验'}</span></div>
    <div class="quiz-q">${esc(q.q)}</div>
    <div id="optList">
      ${q.options.map((o,i)=>`<div class="opt" data-i="${i}"><span class="mark">${letters[i]}</span><span>${esc(o)}</span></div>`).join('')}
    </div>
    <div class="quiz-acts">
      <button class="btn-primary" id="quizSubmit">提交答案</button>
    </div>`;
  let chosen=null;
  box.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click',()=>{
      box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel'); chosen=Number(el.dataset.i);

  });
}
function submitQuiz(bank, q, chosen){
  const correct = (chosen===q.answer);
  let awarded=false;
  if(!isDev()) awarded=recordAnswer(bank,q,correct);
  if(correct){ toast(isDev()?'答对啦':(awarded?'答对啦 +5 分':'答对啦（已掌握，不再加分）')); }
  else { toast('答错了，看解析复习一下'); }
  renderQuizResult(bank, q, chosen, correct);
  renderAll();
}

/* ===== 我的进度（游戏化：记住进度，不做日程提醒） ===== */
function computeStreak(){
  const set=new Set(getArr(ukey('records')).map(r=>r.date));
  if(!set.size) return 0;
  let d=new Date();
  if(!set.has(fmtDate(d))){ d.setDate(d.getDate()-1); if(!set.has(fmtDate(d))) return 0; }
  let cnt=0;
  while(set.has(fmtDate(d))){ cnt++; d.setDate(d.getDate()-1); }
  return cnt;
}

function renderStats(){
  const recs=getArr(ukey('records'));
  const total=recs.length, right=recs.filter(r=>r.correct).length;

  document.getElementById('statTotal').textContent=total;
  document.getElementById('statRight').textContent=right;

  const pieData=[{label:'答对',value:right,color:'#2ecc71'},{label:'答错',value:total-right,color:'#e74c3c'}];
  document.getElementById('pieChart').innerHTML=pieSVG(pieData,140);
  document.getElementById('pieLegend').innerHTML=pieData.filter(d=>d.value>0).map(d=>`<div><i style="background:${d.color}"></i>${d.label} ${d.value}</div>`).join('')||'<div style="color:var(--muted)">暂无数据</div>';
  // 段位进度已移至「段位与积分」卡片（renderRankCard 写入 rankBox），此处不再重复
}
function pieSVG(data,size){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total===0) return '<svg width="'+size+'" height="'+size+'"><circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+(size/2-4)+'" fill="#eef1f4"/></svg>';
  const cx=size/2,cy=size/2,r=size/2-4; let ang=-Math.PI/2,paths='';
  data.forEach(d=>{ if(d.value<=0) return; const frac=d.value/total,a2=ang+frac*2*Math.PI;
    const x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2),large=frac>0.5?1:0;
    paths+='<path d="M'+cx+' '+cy+' L'+x1.toFixed(1)+' '+y1.toFixed(1)+' A'+r+' '+r+' 0 '+large+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+' Z" fill="'+d.color+'"/>'; ang=a2; });
  return '<svg width="'+size+'" height="'+size+'">'+paths+'</svg>';
}

/* ===== 计时模式 ===== */
function setDur(d){
  if(!Number.isFinite(d)) d=DUR_DEFAULT; /* 仅当未传值/NaN 时回退默认，0 是合法下溢值需保留 */
  d=Math.max(DUR_MIN, Math.min(DUR_MAX, Math.round(d)));
  TIMED_DURATION=d;
  const num=document.getElementById('durNum');
  const range=document.getElementById('durRange');
  if(num) num.textContent=d;
  if(range) range.value=d;
  const btn=document.getElementById('timedStart');
  if(btn){ btn.disabled=false; btn.style.opacity='1'; btn.textContent='开始挑战（'+d+'分钟）'; }
}
function renderTimedSetup(){
  const range=document.getElementById('durRange');
  if(range){ range.min=DUR_MIN; range.max=DUR_MAX; range.step=1; range.value=DUR_DEFAULT; }
  setDur(DUR_DEFAULT);
}
function pickRandomAll(){
  const all=[...(BANK.knowledge||[]), ...(BANK.experiment||[])];
  if(!all.length) return null;
  return all[Math.floor(Math.random()*all.length)];
}
function startTimed(dur){
  TIMED={duration:dur,endAt:Date.now()+dur*60000,count:0,correct:0,currentQ:null};
  document.getElementById('timedSetup').style.display='none';
  document.getElementById('timedActive').style.display='';
  document.getElementById('timedResult').style.display='none';
  document.getElementById('timedCount').textContent='0';
  document.getElementById('timedRight').textContent='0';
  if(TIMED_INTERVAL) clearInterval(TIMED_INTERVAL);
  TIMED_INTERVAL=setInterval(timedTick, 1000);
  timedTick();
  renderTimedQuestion();
}
function timedTick(){
  if(!TIMED) return;
  const remain=Math.max(0, TIMED.endAt-Date.now());
  if(remain<=0){ endTimed(); return; }
  const m=Math.floor(remain/60000), s=Math.floor((remain%60000)/1000);
  document.getElementById('timedClock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimedQuestion(){
  if(!TIMED) return;
  const q=pickRandomAll();
  if(!q){ toast('题库为空'); endTimed(); return; }
  TIMED.currentQ=q;
  // 找出 q 所属 bank（knowledge 或 experiment）
  let qBank='knowledge';
  if((BANK.experiment||[]).some(x=>x.id===q.id)) qBank='experiment';
  TIMED.currentBank=qBank;
  SESSION_PLAYED[qBank].add(q.id);
  const letters=['A','B','C','D'];
  const box=document.getElementById('timedQuiz');
  box.innerHTML=`
    <div class="quiz-meta">${esc(q.module)}${qTypeTag(q)}<span style="margin-left:6px;background:#f0f6ff;color:var(--primary);font-size:11px;padding:1px 7px;border-radius:20px;">${qBank==='knowledge'?'知识点':'实验'}</span></div>
    <div class="quiz-q">${esc(q.q)}</div>
    <div id="optList">
      ${q.options.map((o,i)=>`<div class="opt" data-i="${i}"><span class="mark">${letters[i]}</span><span>${esc(o)}</span></div>`).join('')}
    </div>`;
  let chosen=null;
  box.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click',()=>{
      if(TIMED===null) return;
      if(chosen!==null) return; // 已答
      box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel'); chosen=Number(el.dataset.i);
      submitTimedAnswer(chosen);
    });
  });
}
function submitTimedAnswer(chosen){
  if(!TIMED) return;
  const q=TIMED.currentQ; const bank=TIMED.currentBank;
  const correct=(chosen===q.answer);
  TIMED.count++;
  if(correct) TIMED.correct++;
  // 高亮
  const box=document.getElementById('timedQuiz');
  box.querySelectorAll('.opt').forEach((el,i)=>{
    el.style.pointerEvents='none';
    if(i===q.answer) el.classList.add('right');
    else if(i===chosen) el.classList.add('wrong');
  });
  // 记录（计时模式也计入 records，便于看板统计；仅首次答对给分）
  if(!isDev()) recordAnswer(bank,q,correct);
  document.getElementById('timedCount').textContent=TIMED.count;
  document.getElementById('timedRight').textContent=TIMED.correct;
  // 0.5s 后下一题（若未结束）
  setTimeout(()=>{
    if(TIMED) renderTimedQuestion();
  }, 500);
}
function endTimed(){
  if(!TIMED) return;
  if(TIMED_INTERVAL){ clearInterval(TIMED_INTERVAL); TIMED_INTERVAL=null; }
  // 落库
  const recs=getArr(ukey('timed'));
  recs.push({id:uid(), duration:TIMED.duration, count:TIMED.count, correct:TIMED.correct, date:todayStr()});
  setArr(ukey('timed'), recs);
  syncUp();
  // 切到结果
  document.getElementById('timedActive').style.display='none';
  document.getElementById('timedResult').style.display='';
  document.getElementById('resultCount').textContent=TIMED.count;
  document.getElementById('resultRight').textContent=TIMED.correct;
  document.getElementById('resultRate').textContent=(TIMED.count? Math.round(TIMED.correct/TIMED.count*100):0)+'%';
  TIMED=null;
  renderTimedRecords();
}
function renderTimedRecords(){
  const box=document.getElementById('timedRecords');
  if(!box) return;
  const recs=getArr(ukey('timed'));
  if(!recs.length){ box.innerHTML='<div class="rec-empty">还没有刷题记录</div>'; return; }
  // 按时长分组，每组按 count 降序保留 TOP 5
  const groups={};
  recs.forEach(r=>{ (groups[r.duration]=groups[r.duration]||[]).push(r); });
  const durations=Object.keys(groups).map(Number).sort((a,b)=>a-b);
  box.innerHTML=durations.map(d=>{
    const top=groups[d].sort((a,b)=>b.count-a.count || b.correct-a.correct).slice(0,5);
    return `<div class="rec-group">
      <h4><span class="rec-tag">${d}分钟</span>TOP ${top.length}</h4>
      <div class="rec-list">
        ${top.map((r,i)=>`<div class="rec-item">
          <span class="ri-rank">${i+1}</span>
          <span class="ri-count">${r.count}题</span>
          <span class="ri-right">对${r.correct}</span>
          <span class="ri-rate">${r.count? Math.round(r.correct/r.count*100):0}%</span>
          <span class="ri-date">${esc(r.date)}</span>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

document.body.addEventListener('click',e=>{
  const t=e.target;
  // 时长步进
  if(t.id==='durMinus'){ setDur(TIMED_DURATION-1); return; }
  if(t.id==='durPlus'){ setDur(TIMED_DURATION+1); return; }
  if(t.id==='timedStart'){ startTimed(TIMED_DURATION); return; }
  if(t.id==='timedGiveUp'){
    if(!TIMED) return;
    if(confirm('确定结束本轮？已答题数将保存到记录。')) endTimed();
    return;
  }
  if(t.id==='timedAgain'){
    showTimedState('setup');
    renderTimedSetup();
    return;
  }
  if(t.id==='timedBack'){
    showTimedState('setup');
    return;
  }
});

let toastTimer;
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; el.style.cssText='position:fixed;left:50%;top:70px;transform:translateX(-50%) scale(.92);background:#1f2a37;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s ease,transform .28s var(--spring);box-shadow:0 8px 24px rgba(20,30,50,.28);'; document.body.appendChild(el); }
  el.textContent=msg; el.style.opacity='1'; el.style.transform='translateX(-50%) scale(1)'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(-50%) scale(.92)'; },1600);
}

let LEVEL_CTX=null;

function renderRankCard(){

  else { pct=100; sub='已掌握全库 '+lv.mastered+'/'+lv.total+' 题，已达最高段位！'; }

/* ===== 关卡分层：模块 -> 多个 10 题小关 ===== */
const BATCH_SIZE = 10;
function buildBatches(lv){ const ids=lv.qids.slice(), bs=[]; for(let i=0;i<ids.length;i+=BATCH_SIZE) bs.push(ids.slice(i,i+BATCH_SIZE)); return bs; }
function batchId(lv,i){ return lv.id+'#'+i; }
function batchUnlocked(lv,i){
  if(isDev()) return true;
  if(!levelUnlocked(lv,LEVELS)) return false;
  if(i<=0) return true;
  return getLevelState(batchId(lv,i-1)).cleared;
}
function refreshModuleState(lv){
  const bs=buildBatches(lv);
  if(bs.length && bs.every((_,i)=>getLevelState(batchId(lv,i)).cleared)){
    const prev=getLevelState(lv.id);
    if(!prev.cleared){ saveLevelState(lv.id,{...prev,cleared:true}); addPoints('earn',20,'通关：'+lv.module); }
  }
}
/* 自愈：按各小关通关状态重算模块通关（幂等，只补一次）。修复历史 bug 期间
   已全部通关小关但模块状态丢失的存量进度，否则下一模块仍处锁定。 */
function healModuleStates(){ LEVELS.forEach(refreshModuleState); }
let CURRENT_SUB=null;
function openLevel(id){
  const lv=LEVELS.find(x=>x.id===id); if(!lv) return;
  if(!levelUnlocked(lv,LEVELS)){ toast('先通关上一关再解锁'); return; }
  CURRENT_SUB=lv;
  document.getElementById('levelSubTitle').textContent=lv.module+'（'+lv.qids.length+' 题）';
  document.getElementById('levelSub').classList.add('show');
  renderLevelSub(lv);
}
function renderLevelSub(lv){
  const box=document.getElementById('levelBatchList');
  const bs=buildBatches(lv);
  box.innerHTML=bs.map((chunk,i)=>{
    const st=getLevelState(batchId(lv,i));
    const unlocked=batchUnlocked(lv,i);
    const cls=st.cleared?'cleared':(unlocked?'open':'locked');
    const best=st.best?(' · 最佳'+Math.round(st.best*100)+'%'):'';
    const lock=unlocked?'':'<span class="lv-lock">锁</span>';
    const btn=unlocked?'<button class="lv-go" data-batch="'+i+'">进入</button>':'';
    return '<div class="lv-card '+cls+'" '+(unlocked?'data-batch="'+i+'"':'')+'>'+lock+
      '<div class="lv-name">第 '+(i+1)+' 关</div>'+
      '<div class="lv-sub">'+chunk.length+' 题 · 达标 '+Math.round(lv.pass*100)+'%'+best+'</div>'+
      btn+'</div>';
  }).join('');
}
function startBatch(lv,i){
  const chunk=buildBatches(lv)[i];
  LEVEL_CTX={bank:lv.bank, qids:chunk, idx:0, correct:0, total:chunk.length, pass:lv.pass, levelId:batchId(lv,i), module:lv.module, moduleId:lv.id, batchIndex:i};
  document.getElementById('levelTitle').textContent=lv.module+' · 第'+(i+1)+'关（'+chunk.length+' 题）';
  document.getElementById('levelModal').classList.add('show');
  renderLevelQuestion();
}
function renderLevelQuestion(){
  const c=LEVEL_CTX; const q=getQ(c.bank, c.qids[c.idx]);
  document.getElementById('levelTitle').textContent=c.module+' · 第'+(c.batchIndex+1)+'关（'+c.total+' 题）';
  const box=document.getElementById('levelBody');
  const letters=['A','B','C','D'];
  box.innerHTML=
    '<div class="lv-progress">第 '+(c.idx+1)+' / '+c.total+' 题　已答对 '+c.correct+'</div>'+
    '<div class="quiz-meta">'+esc(q.module)+qTypeTag(q)+'</div>'+
    '<div class="quiz-q">'+esc(q.q)+'</div>'+
    '<div id="optList">'+q.options.map((o,i)=>'<div class="opt" data-i="'+i+'"><span class="mark">'+letters[i]+'</span><span>'+esc(o)+'</span></div>').join('')+'</div>'+
    '<div class="quiz-acts"><button class="btn-primary" id="lvSubmit">提交答案</button>'+(isDev()?'<button class="btn-ghost" id="lvSkip" style="margin-left:8px;">下一题</button><button class="btn-ghost" id="lvDel" style="margin-left:8px;">删除本题</button>':'')+'</div>';
  let chosen=null;
  box.querySelectorAll('.opt').forEach(el=>{ el.addEventListener('click',()=>{ box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); chosen=Number(el.dataset.i); }); });
  document.getElementById('lvSubmit').addEventListener('click',()=>{ if(chosen===null){ toast('请先选择一个答案'); return; } levelSubmit(c.bank,q,chosen); });
  const skipEl=document.getElementById('lvSkip');
  if(skipEl) skipEl.addEventListener('click',()=>{ if(c.idx+1<c.total){ c.idx++; renderLevelQuestion(); } else renderLevelResult(); });
  const delEl=document.getElementById('lvDel');
  if(delEl) delEl.addEventListener('click',()=>{
    if(!confirm('确定删除本题「'+q.q+'」？\n删除后将从题库永久移除，无法恢复（清空数据也不会还原）。')) return;
    const curId=c.qids[c.idx];
    deleteQuestion(c.bank, curId);
    c.qids.splice(c.idx,1); c.total=c.qids.length;
    if(c.idx>=c.total){ renderLevelResult(); } else { renderLevelQuestion(); }
  });
}
function levelSubmit(bank,q,chosen){
  const correct=(chosen===q.answer); const c=LEVEL_CTX;
  if(!isDev()) recordAnswer(bank,q,correct);
  if(correct){ c.correct++; }
  const box=document.getElementById('levelBody');
  const letters=['A','B','C','D'];
  box.innerHTML=
    '<div class="quiz-meta">'+esc(q.module)+qTypeTag(q)+'</div>'+
    '<div class="quiz-q">'+esc(q.q)+'</div>'+
    '<div>'+q.options.map((o,i)=>{ let cls='opt'; if(i===q.answer) cls+=' right'; else if(i===chosen) cls+=' wrong';
      const tag=i===q.answer?'<b style="color:#2ecc71;margin-left:6px;">正确答案</b>':(i===chosen?'<b style="color:#e74c3c;margin-left:6px;">你的选择</b>':'');
      return '<div class="'+cls+'"><span class="mark">'+letters[i]+'</span><span>'+esc(o)+tag+'</span></div>'; }).join('')+'</div>'+
    '<div class="explain"><b>解析：</b>'+esc(q.explain)+'</div>'+
    '<div class="quiz-acts"><button class="btn-primary" id="lvNext">'+(c.idx+1<c.total?'下一题':'查看结算')+'</button></div>';
  document.getElementById('lvNext').addEventListener('click',()=>{ if(c.idx+1<c.total){ c.idx++; renderLevelQuestion(); } else renderLevelResult(); });
  renderAll();
}
function renderLevelResult(){
  const c=LEVEL_CTX; const rate=c.correct/c.total; const pass=rate>=c.pass;
  let firstClear=false;
  if(!isDev()){
    const st=getLevelState(c.levelId); firstClear=!st.cleared && pass;
    saveLevelState(c.levelId,{id:c.levelId, cleared:st.cleared||pass, best:Math.max(st.best,rate), correct:c.correct, total:c.total, plays:st.plays+1});
    if(firstClear){ addPoints('earn',20,'通关：'+c.module+' 第'+(c.batchIndex+1)+'关'); }
    refreshModuleState(LEVELS.find(x=>x.id===c.moduleId));
  }
  const box=document.getElementById('levelBody');
  box.innerHTML=
    '<div style="text-align:center;padding:14px 0;">'+
      '<div style="font-size:20px;font-weight:800;color:'+(pass?'#27ae60':'#e67e22')+';">'+(pass?'恭喜过关！':'再接再厉')+'</div>'+
      '<div class="lv-progress" style="margin-top:8px;">答对 '+c.correct+' / '+c.total+'　正确率 '+Math.round(rate*100)+'%（达标 '+Math.round(c.pass*100)+'%）</div>'+
      (pass?'<div style="color:var(--muted);font-size:13px;">'+(firstClear?'已通关 +20 分，下一关已解锁！':'本关已通关')+'</div>':'<div style="color:var(--muted);font-size:13px;">达标线 '+Math.round(c.pass*100)+'%，差一点，再来一次就能解锁下一关</div>')+
    '</div>'+
    '<div class="quiz-acts"><button class="btn-primary" id="lvBack">返回关卡列表</button></div>';
  document.getElementById('lvBack').addEventListener('click',closeLevel);
  renderAll();
}

/* 后台自动同步：长开页面也能持续对齐云端（如另一台设备刚攒的积分）。
   进行中的计时答题（TIMED_INTERVAL 活跃）时跳过，避免打断；仅在数据确实有变化时才重渲染。 */
(function startAutoSyncHeartbeat(){
  const BASES=['records','points','rewards','levels','flash','practice','timed'];
  const sig=()=>BASES.map(b=>JSON.stringify(getArr(ukey(b)))).join('|');
  setInterval(async ()=>{
    if(!sessionUser() || !serverURL() || TIMED_INTERVAL) return; // 未登录 / 答题进行中 → 跳过
    const before=sig();
    const ok=await autoSync().catch(()=>false);
    if(ok && sig()!==before) renderAll(); // 仅当云端数据有变化才刷新界面
  }, 90000);
})();

  document.getElementById('authCurUser').textContent=sessionUser();
}
async function onAuthSubmit(){
  const u=document.getElementById('authUser').value, p=document.getElementById('authPw').value;
  const msg=document.getElementById('authMsg'); msg.textContent='';
  if(!u||!p){ msg.textContent='请输入用户名和密码'; return; }
  let r;
  if(authMode==='register'){
    const p2=document.getElementById('authPw2').value;
    if(p!==p2){ msg.textContent='两次输入的密码不一致'; return; }
    r = await serverRegister(u,p);
  } else {
    r = await serverLogin(u,p);
  }
  if(!r.ok){ msg.textContent=r.msg; return; }
  _authExpiredHandled=false; // 重新登录成功，过期处理守卫复位
  closeAuth(); refreshAccountUI();
  // 云端模式：登录/注册成功后先推本地(若有)再拉云端最新，保证多端一致
  const bases=['records','points','rewards','levels','flash','practice','timed'];
  if(bases.some(b=>getArr(ukey(b)).length>0)) await syncUp();
  await syncDown();
  healModuleStates();
  renderAll();
}
function onAuthLogout(){
  logout(); refreshAccountUI();
  openAuth('login');
}
function onAuthSwitchUser(){
  logout(); openAuth('login');
}
// 账户卡按钮监听已移至 body 事件委托外的 accountCardBtn 绑定（避免重复）
document.getElementById('authClose').addEventListener('click',closeAuth);
document.getElementById('authSubmit').addEventListener('click',onAuthSubmit);
document.getElementById('authSwitch').addEventListener('click',()=>{ showAuthForm(authMode==='register'?'login':'register'); });
document.getElementById('authLogout').addEventListener('click',()=>{ closeAuth(); onAuthLogout(); });
document.getElementById('authSwitchUser').addEventListener('click',()=>{ closeAuth(); onAuthSwitchUser(); });
document.getElementById('authMask').addEventListener('click',e=>{ if(e.target.id==='authMask' && document.getElementById('authClose').style.display!=='none') closeAuth(); });
</script>
