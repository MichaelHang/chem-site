<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#f6f7fa" stroke="#dfe4ee" stroke-width="1"/>
  <!-- 节点连线（图谱意象） -->
  <g stroke="#a9b6cc" stroke-width="1.6" stroke-linecap="round">
    <line x1="16" y1="16" x2="7"  y2="9"/>
    <line x1="16" y1="16" x2="25" y2="10"/>
    <line x1="16" y1="16" x2="9"  y2="25"/>
    <line x1="16" y1="16" x2="24" y2="24"/>
    <line x1="7"  y1="9"  x2="25" y2="10"/>
    <line x1="9"  y1="25" x2="24" y2="24"/>
  </g>
  <!-- 节点（配色与页面六类节点一致） -->
  <circle cx="16" cy="16" r="4.2" fill="#3b82f6" stroke="#fff" stroke-width="0.8"/>
  <circle cx="7"  cy="9"  r="2.8" fill="#38b27e" stroke="#fff" stroke-width="0.8"/>
  <circle cx="25" cy="10" r="2.8" fill="#ee7725" stroke="#fff" stroke-width="0.8"/>
  <circle cx="9"  cy="25" r="2.6" fill="#8a72e8" stroke="#fff" stroke-width="0.8"/>
  <circle cx="24" cy="24" r="2.6" fill="#22a2a8" stroke="#fff" stroke-width="0.8"/>
</svg>
